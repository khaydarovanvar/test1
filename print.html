<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ali Math — printable worksheets</title>
<meta name="description" content="Printable first-grade math worksheets: number tracing, counting, addition, subtraction, multiplication, division. English and Uzbek.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖨️</text></svg>">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/print.css">
</head>
<body>

<div class="toolbar">
  <h1 id="tbTitle">🖨️ Make practice sheets</h1>
  <p class="hint" id="tbHint">Pick a type → “New set” → “Print”. Every refresh makes brand-new problems. Answers go on the last page.</p>
  <div class="controls">
    <div class="field">
      <label for="fType" id="lbType">Exercise type</label>
      <select id="fType">
        <optgroup label="Basics" id="ogBasics">
          <option value="trace">✍️ Number tracing (0–9)</option>
          <option value="count">🍎 Count and write</option>
          <option value="numline">📏 Number line</option>
          <option value="compare">⚖️ Compare &lt; &gt; =</option>
        </optgroup>
        <optgroup label="English" id="ogEng">
          <option value="letters">🔤 Alphabet tracing (A–Z)</option>
          <option value="dict">🖼️ Picture dictionary</option>
        </optgroup>
        <optgroup label="Operations" id="ogOps">
          <option value="add" selected>➕ Addition</option>
          <option value="sub">➖ Subtraction</option>
          <option value="addsub">➕➖ Mixed add/subtract</option>
          <option value="vertical">🧮 Column add/subtract</option>
          <option value="mul">✖️ Multiplication</option>
          <option value="div">➗ Division</option>
          <option value="all">🎲 All mixed</option>
        </optgroup>
        <optgroup label="Fun" id="ogFun">
          <option value="table">📋 Times tables (poster)</option>
          <option value="color">🎨 Solve and color</option>
        </optgroup>
      </select>
    </div>

    <div class="field">
      <label for="fLevel" id="lbLevel">Difficulty</label>
      <select id="fLevel">
        <option value="1">1 — easiest</option>
        <option value="2" selected>2 — medium</option>
        <option value="3">3 — hard</option>
        <option value="4">4 — expert</option>
      </select>
    </div>

    <div class="field">
      <label for="fPages" id="lbPages">Sheets</label>
      <select id="fPages">
        <option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option>
      </select>
    </div>

    <div class="field">
      <label for="fName" id="lbName">Name</label>
      <input id="fName" type="text" value="Ali" maxlength="20">
    </div>

    <div class="field">
      <label for="fLang" id="lbLang">Language</label>
      <select id="fLang">
        <option value="en">English</option>
        <option value="uz">O'zbekcha</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    <div class="field chk">
      <input id="fKey" type="checkbox" checked>
      <label for="fKey" id="lbKey">Answer key page</label>
    </div>

    <div class="field chk">
      <input id="fBW" type="checkbox">
      <label for="fBW" id="lbBW">Black &amp; white (save ink)</label>
    </div>

    <button class="tbtn alt" id="btnMake">🎲 New set</button>
    <button class="tbtn" id="btnPrint">🖨️ Print</button>
    <a class="tbtn alt" href="index.html" id="btnBack" style="text-decoration:none; display:inline-block">🏠 Back to games</a>
  </div>
</div>

<div id="sheets"></div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/vocab.js"></script>
<script src="assets/js/worksheets.js"></script>
</body>
</html>
