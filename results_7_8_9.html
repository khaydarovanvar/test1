<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006040">
<title>Qabul imtihoni natijalari — Ellipse International School</title>
<meta name="description" content="Ellipse International School qabul imtihoni natijalari. Familiyangizni qidiring va grant miqdorini ko'ring.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#062A1C; --ink-2:#0B4A32; --muted:#6C7C74;
  --paper:#EEF2EC; --card:#FFFFFF; --line:#DCE4DE;
  --green:#006040; --green-2:#0E8A5C; --green-soft:#DDEBE3;
  --amber:#E07A16; --amber-2:#F59B3C; --amber-soft:#FBEAD6; --gold:#A9822A;
  --r:14px;
  --shadow:0 1px 2px rgba(6,42,28,.05), 0 8px 24px -12px rgba(6,42,28,.2);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* ---------- hero ---------- */
.hero{
  background:
    radial-gradient(120% 90% at 92% -12%, rgba(224,122,22,.34) 0%, rgba(224,122,22,0) 55%),
    linear-gradient(168deg,#042316 0%,#00432C 55%,#006040 140%);
  color:#fff; padding:20px 0 0; position:relative; overflow:hidden;
}
.top{display:flex;justify-content:flex-end;margin-bottom:14px}
.lang{display:flex;gap:2px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:9px;padding:3px}
.lang button{
  appearance:none;border:0;background:transparent;color:#B9D8C9;cursor:pointer;
  font:700 11px/1 "JetBrains Mono",monospace;letter-spacing:.06em;padding:7px 11px;border-radius:6px;
  transition:background .18s,color .18s;
}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.eyebrow{
  font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:600;
  color:#9FD9BC; margin:0 0 10px; display:inline-flex; align-items:center; gap:8px;
  text-decoration:none; transition:color .18s;
}
.eyebrow:hover{color:#fff}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--amber);border-radius:2px}
h1{
  font-family:"Bricolage Grotesque",Georgia,serif; font-weight:800;
  font-size:clamp(29px,7.8vw,48px); line-height:1.03; letter-spacing:-.025em; margin:0 0 12px;
}
h1 em{font-style:normal;color:#7FE0B0;display:block}
.lede{margin:0 0 24px;max-width:44ch;color:#C6DED2;font-size:15px}


/* ---------- programs / narx ---------- */
.progs{margin:16px 0 2px}
.progs h2{font-family:"Bricolage Grotesque",Georgia,serif;font-weight:800;
  font-size:19px;letter-spacing:-.02em;margin:0 0 10px}
.prog-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
.prog{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 14px 14px 17px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.prog::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green-2)}
.prog-cam::before{background:var(--amber)}
.prog h3{font-family:"Bricolage Grotesque",Georgia,serif;font-weight:700;font-size:17px;
  margin:0 0 7px;letter-spacing:-.012em}
.prog-price{margin:0 0 9px;font-family:"JetBrains Mono",monospace;font-weight:700;
  font-size:21px;letter-spacing:-.035em;color:var(--green);white-space:nowrap}
.prog-cam .prog-price{color:#A85508}
.prog-price i{font-style:normal;font-family:"Instrument Sans",sans-serif;font-weight:500;
  font-size:12px;color:var(--muted);margin-left:6px;letter-spacing:0}
.prog-subj{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 0;padding:0;list-style:none}
.prog-subj li{
  font:700 15px/1.15 "Instrument Sans",sans-serif;letter-spacing:-.01em;
  background:var(--green-soft);color:var(--ink-2);
  padding:10px 14px;border-radius:10px;
  opacity:0;transform:translateY(9px);
  animation:subjIn .52s cubic-bezier(.2,.85,.3,1) forwards,
            subjPulse 5.4s ease-in-out infinite;
  animation-delay:calc(var(--i,0) * .075s), calc(1.1s + var(--i,0) * .19s);
}
.prog-cam .prog-subj li{background:var(--amber-soft);color:#8A4A08}
.prog-subj li.subj-note{
  background:transparent;color:var(--muted);padding:10px 2px 0;
  font-weight:600;font-style:italic;font-size:13.5px;letter-spacing:0;
  animation:subjIn .52s cubic-bezier(.2,.85,.3,1) forwards;
  animation-delay:calc(var(--i,0) * .075s);
}
@keyframes subjIn{to{opacity:1;transform:none}}
@keyframes subjPulse{
  0%,74%,100%{background:var(--green-soft);color:var(--ink-2);
    transform:translateY(0) scale(1);box-shadow:0 0 0 0 rgba(14,138,92,0)}
  82%{background:var(--green-2);color:#fff;
    transform:translateY(-4px) scale(1.045);box-shadow:0 8px 16px -7px rgba(14,138,92,.7)}
  90%{background:var(--green-soft);color:var(--ink-2);
    transform:translateY(0) scale(1);box-shadow:0 0 0 0 rgba(14,138,92,0)}
}
@media (prefers-reduced-motion: reduce){
  .prog-subj li,.prog-subj li.subj-note{opacity:1;transform:none;animation:none}
}
@media(max-width:560px){.prog-subj li{font-size:14px;padding:9px 12px}}
.prog-note{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.grant-exp{margin:18px 0 0;font-size:15px;line-height:1.6;color:var(--ink-2);
  border-left:4px solid var(--green-2);padding:2px 0 2px 14px}
.grant-exp b{font-weight:600}
@media(max-width:560px){.prog-grid{grid-template-columns:1fr}.prog-price{font-size:19px}}

/* ---------- sticky controls ---------- */
.bar{
  position:sticky; top:0; z-index:20; background:rgba(238,242,236,.94);
  backdrop-filter:saturate(150%) blur(10px); -webkit-backdrop-filter:saturate(150%) blur(10px);
  border-bottom:1px solid var(--line); padding:10px 0;
}
.bar-in{display:flex;gap:8px;align-items:center}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex:0 0 auto}
.tab{
  appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;
  font:600 14px/1 "Instrument Sans",sans-serif; padding:9px 12px; border-radius:8px; white-space:nowrap;
  transition:background .18s, color .18s;
}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.search{position:relative;flex:1 1 auto;min-width:0}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}
#q{
  width:100%; border:1px solid var(--line); background:var(--card); border-radius:11px;
  padding:11px 34px 11px 36px; font:500 15px/1.2 "Instrument Sans",sans-serif; color:var(--ink);
}
#q::placeholder{color:#93A29A}
#q:focus{outline:2px solid var(--green);outline-offset:1px;border-color:transparent}
#clear{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;
  cursor:pointer;font-size:19px;line-height:1;color:var(--muted);padding:5px 7px;border-radius:8px;display:none;
}
#clear.on{display:block}

/* ---------- column key ---------- */
.cols{
  display:flex; align-items:center; gap:8px; padding:14px 13px 4px 46px;
  font:700 9.5px/1 "JetBrains Mono",monospace; letter-spacing:.13em;
  text-transform:uppercase; color:#93A29A;
}
.c-who{flex:1 1 auto}
.c-pct{flex:0 0 auto;min-width:38px;text-align:right;color:var(--green)}
.c-grant{flex:0 0 auto;width:52px;text-align:center;color:var(--amber)}
.grant-lbl{
  display:block; font:700 8px/1 "JetBrains Mono",monospace; letter-spacing:.1em;
  text-transform:uppercase; opacity:.62; margin-bottom:3px;
}
.grant{text-align:center;min-width:52px;flex:0 0 auto}

/* ---------- list ---------- */
main{padding:4px 0 40px}
.row{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  margin-top:8px; overflow:hidden; box-shadow:var(--shadow);
}
.head{
  display:grid; grid-template-columns:26px minmax(0,1fr) auto; gap:9px; align-items:center;
  width:100%; text-align:left; padding:13px 13px 13px 11px; background:transparent;
  border:0; cursor:pointer; font:inherit; color:inherit;
}
.head > *{min-width:0}
.head:focus-visible{outline:2px solid var(--green);outline-offset:-3px}
.rank{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;color:var(--muted);text-align:center}
.row[data-top="1"] .rank{color:var(--gold)}
.who{min-width:0;display:block}
.name{display:block;font-size:15px;letter-spacing:-.01em;line-height:1.3;
  overflow-wrap:anywhere;hyphens:none}
.name .fam{font-weight:700}
.name .giv{font-weight:500;color:var(--ink-2)}
.name mark{background:#FFE9AE;color:inherit;border-radius:3px;padding:0 1px}
.meter{display:block;position:relative;height:4px;background:var(--green-soft);border-radius:3px;margin-top:7px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--green-2);border-radius:3px;
  transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.pct{flex:0 0 auto;font-family:"JetBrains Mono",monospace;font-weight:700;
  font-size:15px;letter-spacing:-.04em;min-width:38px;text-align:right}
.grant{
  font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12px;
  padding:5px 7px;border-radius:7px;background:var(--green-soft);color:var(--green);white-space:nowrap;
}
.grant[data-t="full"]{background:var(--ink);color:#7FE0B0}
.grant[data-t="high"]{background:var(--amber-soft);color:#A85508}
.grants{display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
.grants .grant{padding:4px 7px}
.grants .grant-lbl{margin-bottom:2px}
.grant[data-t="none"]{background:#E7ECE8;color:var(--muted)}
.chev{width:9px;height:9px;border-right:2px solid #A9B7AF;border-bottom:2px solid #A9B7AF;
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .22s;flex:0 0 auto}
.row.open .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.body{display:none;padding:2px 13px 14px 46px;border-top:1px solid var(--line);background:#FBFCFB}
.row.open .body{display:block}
.subj{display:flex;align-items:center;gap:10px;padding:10px 0}
.subj + .subj{border-top:1px dashed var(--line)}
.subj-n{flex:1 1 auto;font-size:14px;color:var(--ink-2);font-weight:500}
.subj-n .of{display:block;font-style:normal;font-family:"JetBrains Mono",monospace;
  font-size:10.5px;color:#93A29A;margin-top:2px}
.track{flex:0 0 84px;height:6px;background:#E6ECE8;border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink-2);border-radius:4px}
.subj:nth-child(2) .track i{background:var(--green-2)}
.subj:nth-child(3) .track i{background:var(--amber)}
.subj-v{flex:0 0 auto;min-width:82px;text-align:right;font-family:"JetBrains Mono",monospace;
  font-size:12px;color:var(--green);font-weight:700}
.subj-v b{color:var(--ink);font-weight:700;font-size:17px;letter-spacing:-.02em}
.subj-v i{display:block;font-style:normal;color:#B0685E;font-size:11px;margin-top:2px;font-weight:500}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:6px;
  font-family:"Bricolage Grotesque",sans-serif}

/* ---------- certificate callout ---------- */
.cert{
  margin-top:14px; border-radius:var(--r); overflow:hidden; scroll-margin-top:76px;
  background:
    radial-gradient(110% 130% at 100% 0%, rgba(224,122,22,.3) 0%, rgba(224,122,22,0) 52%),
    linear-gradient(160deg,#042316 0%,#00432C 60%,#006040 130%);
  color:#fff; box-shadow:var(--shadow); position:relative;
}
.cert::before{content:"";position:absolute;inset:0;border-radius:var(--r);
  border:1px solid rgba(255,255,255,.14);pointer-events:none}
.cert.flash{animation:flash 1.5s ease-out}
@keyframes flash{0%,100%{box-shadow:var(--shadow)}
  20%,60%{box-shadow:0 0 0 4px rgba(224,122,22,.55), var(--shadow)}}
.cert-band{
  position:absolute; top:15px; right:-36px; transform:rotate(38deg);
  background:var(--amber); color:#fff; font:700 10px/1 "JetBrains Mono",monospace;
  letter-spacing:.12em; text-transform:uppercase; padding:6px 42px;
}
.cert-in{padding:24px 18px 20px}
.cert h2{
  font-family:"Bricolage Grotesque",sans-serif; font-weight:800;
  font-size:clamp(21px,5.4vw,27px); letter-spacing:-.02em; margin:0 0 13px; padding-right:70px;
}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.chip{
  font-family:"JetBrains Mono",monospace; font-weight:700; font-size:12px;
  padding:6px 11px; border-radius:8px;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); color:#9FE7C3;
}
.cert p{margin:0 0 16px;font-size:14px;line-height:1.62;color:#CDE4D8;max-width:56ch}
.cert-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{
  display:inline-flex; align-items:center; gap:8px; text-decoration:none;
  font:600 14px/1 "Instrument Sans",sans-serif; padding:12px 16px; border-radius:11px;
  transition:transform .15s, filter .15s;
}
.btn:active{transform:scale(.97)}
.btn-solid{background:var(--amber);color:#fff}
.btn-solid:hover{filter:brightness(1.06)}
.btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff}

/* ---------- legend / footer ---------- */
.note{
  margin-top:12px;margin-bottom:8px;background:var(--card);
  border:1px solid var(--line);border-radius:18px;padding:24px 22px 22px;
  position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(6,42,28,.05), 0 18px 44px -26px rgba(6,42,28,.42);
}
.note::before{
  content:"";position:absolute;left:0;right:0;top:0;height:4px;
  background:linear-gradient(90deg,var(--ink) 0%,var(--green-2) 34%,var(--amber) 72%,var(--amber-2) 100%);
  background-size:220% 100%;animation:bandSlide 7s linear infinite;
}
.note::after{
  content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(14,138,92,.11) 0%,rgba(14,138,92,0) 68%);pointer-events:none;
}
.note h2{
  font-family:"Bricolage Grotesque",Georgia,serif;font-weight:800;
  font-size:clamp(23px,5.4vw,29px);line-height:1.08;letter-spacing:-.025em;margin:0 0 7px;
}
.note p{margin:0 0 18px;font-size:15.5px;line-height:1.55;color:var(--muted);max-width:52ch}
.tiers{display:flex;flex-wrap:wrap;gap:9px}
.tier{
  font-family:"JetBrains Mono",monospace;font-size:17px;font-weight:700;letter-spacing:-.02em;
  padding:13px 17px;border-radius:12px;background:var(--green-soft);color:var(--green);
  opacity:0;transform:translateY(11px) scale(.94);
  animation:tierIn .55s cubic-bezier(.2,.85,.3,1) forwards,
            tierWave 5.6s ease-in-out infinite;
  animation-delay:calc(var(--i,0) * .085s), calc(1.2s + var(--i,0) * .2s);
}
.tier[data-t="full"]{
  background:var(--ink);color:#7FE0B0;position:relative;overflow:hidden;
  font-size:19px;padding:13px 20px;
  box-shadow:0 10px 24px -12px rgba(6,42,28,.85);
}
.tier[data-t="full"]::after{
  content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;
  background:linear-gradient(100deg,transparent,rgba(127,224,176,.42),transparent);
  animation:shine 3.4s ease-in-out infinite;
}
.tier[data-t="high"]{background:var(--amber-soft);color:#A85508}
@keyframes tierIn{to{opacity:1;transform:none}}
@keyframes tierWave{
  0%,76%,100%{transform:translateY(0) scale(1)}
  84%{transform:translateY(-5px) scale(1.06)}
  92%{transform:translateY(0) scale(1)}
}
@keyframes bandSlide{to{background-position:220% 0}}
@keyframes shine{0%,62%{left:-60%}100%{left:130%}}
@media (prefers-reduced-motion: reduce){
  .tier{opacity:1;transform:none;animation:none}
  .note::before{animation:none}
  .tier[data-t="full"]::after{display:none}
}
.scoring{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);font-size:15px;color:var(--ink-2);line-height:1.9}
.scoring span{display:inline-block;margin-right:18px;white-space:nowrap}
.scoring b{color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:15.5px}
/* ---------- beacon: link home ---------- */
.beacon{
  display:block; margin:16px 0 14px; padding:2px; border-radius:18px; text-decoration:none;
  position:relative; overflow:hidden; isolation:isolate;
  box-shadow:0 18px 44px -24px rgba(6,42,28,.95);
  opacity:0; transform:translateY(14px) scale(.985);
  transition:opacity .7s cubic-bezier(.2,.8,.3,1), transform .7s cubic-bezier(.2,.8,.3,1);
}
.beacon.in{opacity:1;transform:none}
.beacon::before{ /* rotating gradient rim */
  content:""; position:absolute; inset:-65%; z-index:-1;
  background:conic-gradient(from 0deg,var(--amber),#FFDCA6,#7FE0B0,var(--green-2),var(--green),var(--amber));
  animation:spin 4.5s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.beacon-in{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  border-radius:16px; padding:20px 18px; position:relative; overflow:hidden;
  background:#042316;
}
/* drifting aurora */
.aurora{
  position:absolute; inset:-30%; border-radius:inherit; pointer-events:none; z-index:0;
  background:
    radial-gradient(38% 52% at 18% 30%, rgba(0,150,100,.85) 0%, transparent 62%),
    radial-gradient(34% 46% at 78% 22%, rgba(224,122,22,.6) 0%, transparent 64%),
    radial-gradient(42% 56% at 62% 84%, rgba(20,190,130,.5) 0%, transparent 66%),
    radial-gradient(30% 40% at 30% 88%, rgba(255,200,120,.35) 0%, transparent 64%);
  filter:blur(6px); animation:drift 13s ease-in-out infinite alternate;
}
@keyframes drift{
  0%{transform:translate3d(-4%,-3%,0) scale(1)}
  50%{transform:translate3d(5%,4%,0) scale(1.12)}
  100%{transform:translate3d(-3%,5%,0) scale(1.04)}
}
/* light sweep */
.beacon-in::after{
  content:""; position:absolute; top:0; bottom:0; width:36%; z-index:2; pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent);
  transform:skewX(-18deg); animation:sweep 3.6s ease-in-out infinite;
}
@keyframes sweep{0%{left:-45%}55%,100%{left:120%}}
/* floating sparks */
.orbs{position:absolute;inset:0;overflow:hidden;border-radius:inherit;z-index:1;pointer-events:none}
.orbs i{position:absolute;width:5px;height:5px;border-radius:50%;background:#FFD79A;opacity:.75;
  filter:blur(.4px);animation:float 9s ease-in-out infinite}
.orbs i:nth-child(1){left:12%;bottom:-8px;animation-delay:0s}
.orbs i:nth-child(2){left:44%;bottom:-8px;width:4px;background:#9FE7C3;animation-delay:2.2s;animation-duration:11s}
.orbs i:nth-child(3){left:68%;bottom:-8px;width:6px;animation-delay:4.4s;animation-duration:10s}
.orbs i:nth-child(4){left:88%;bottom:-8px;width:4px;background:#9FE7C3;animation-delay:6.1s;animation-duration:12s}
@keyframes float{
  0%{transform:translateY(0) translateX(0);opacity:0}
  15%{opacity:.8}
  85%{opacity:.5}
  100%{transform:translateY(-130px) translateX(14px);opacity:0}
}

.beacon-txt{flex:1 1 190px;min-width:0;position:relative;z-index:3}
.live{display:flex;align-items:center;gap:7px;font:700 10px/1 "JetBrains Mono",monospace;
  letter-spacing:.14em;text-transform:uppercase;color:#FFD09A;margin-bottom:8px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--amber-2);flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(245,155,60,.9);animation:blip 2s ease-out infinite}
@keyframes blip{0%{box-shadow:0 0 0 0 rgba(245,155,60,.85)}
  70%{box-shadow:0 0 0 11px rgba(245,155,60,0)}100%{box-shadow:0 0 0 0 rgba(245,155,60,0)}}
.beacon-txt b{
  display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:clamp(19px,5vw,25px);letter-spacing:-.025em;line-height:1.14;

    cText:"\u0423\u0447\u0435\u043d\u0438\u043a\u0430\u043c, \u0438\u043c\u0435\u044e\u0449\u0438\u043c \u0441\u0435\u0440\u0442\u0438\u0444\u0438\u043a\u0430\u0442 IELTS, SAT \u0438\u043b\u0438 Milliy sertifikat, \u043c\u043e\u0433\u0443\u0442 \u0431\u044b\u0442\u044c \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u044b \u0434\u043e\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0435 \u0433\u0440\u0430\u043d\u0442\u043e\u0432\u044b\u0435 \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0441\u0442\u0438. \u0417\u0430 \u043f\u043e\u0434\u0440\u043e\u0431\u043d\u043e\u0439 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u0435\u0439 \u043e \u0442\u0430\u043a\u0438\u0445 \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0441\u0442\u044f\u0445 \u0438 \u0434\u043b\u044f \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u0438\u044f \u0438\u043d\u0434\u0438\u0432\u0438\u0434\u0443\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0441\u043b\u0443\u0447\u0430\u044f \u043f\u0440\u043e\u0441\u0438\u043c \u043e\u0431\u0440\u0430\u0449\u0430\u0442\u044c\u0441\u044f \u043a \u0430\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u0448\u043a\u043e\u043b\u044b.",
    nTitle:"\u0423\u0440\u043e\u0432\u043d\u0438 \u0433\u0440\u0430\u043d\u0442\u0430",
    nText:"\u0413\u0440\u0430\u043d\u0442 \u2014 \u044d\u0442\u043e \u0440\u0430\u0437\u043c\u0435\u0440 \u0441\u043a\u0438\u0434\u043a\u0438 \u043e\u0442 \u043e\u043f\u043b\u0430\u0442\u044b \u0437\u0430 \u043e\u0431\u0443\u0447\u0435\u043d\u0438\u0435.",
    scoring:{"7":[["\u041c\u0430\u0442\u0435\u043c\u0430\u0442\u0438\u043a\u0430","20 \u0432\u043e\u043f\u0440. \u00b7 2.5 \u0431\u0430\u043b\u043b\u0430"],["English","20 \u0432\u043e\u043f\u0440. \u00b7 1 \u0431\u0430\u043b\u043b"],["\u0420\u043e\u0434\u043d\u043e\u0439 / \u0440\u0443\u0441\u0441\u043a\u0438\u0439","10 \u0432\u043e\u043f\u0440. \u00b7 1.5 \u0431\u0430\u043b\u043b\u0430"]],
             "8":[["\u041c\u0430\u0442\u0435\u043c\u0430\u0442\u0438\u043a\u0430","20 \u0432\u043e\u043f\u0440. \u00b7 2.5 \u0431\u0430\u043b\u043b\u0430"],["English","20 \u0432\u043e\u043f\u0440. \u00b7 1.5 \u0431\u0430\u043b\u043b\u0430"],["\u0420\u043e\u0434\u043d\u043e\u0439 / \u0440\u0443\u0441\u0441\u043a\u0438\u0439","10 \u0432\u043e\u043f\u0440. \u00b7 1 \u0431\u0430\u043b\u043b"]],
             "9":[["\u041c\u0430\u0442\u0435\u043c\u0430\u0442\u0438\u043a\u0430","20 \u0432\u043e\u043f\u0440. \u00b7 2.5 \u0431\u0430\u043b\u043b\u0430"],["English","20 \u0432\u043e\u043f\u0440. \u00b7 1.5 \u0431\u0430\u043b\u043b\u0430"],["\u0420\u043e\u0434\u043d\u043e\u0439 / \u0440\u0443\u0441\u0441\u043a\u0438\u0439","10 \u0432\u043e\u043f\u0440. \u00b7 1 \u0431\u0430\u043b\u043b"]]},
    foot:"\u041f\u043e \u0432\u043e\u043f\u0440\u043e\u0441\u0430\u043c \u043e\u0431\u0440\u0430\u0449\u0430\u0439\u0442\u0435\u0441\u044c \u0432 \u043f\u0440\u0438\u0451\u043c\u043d\u0443\u044e \u043a\u043e\u043c\u0438\u0441\u0441\u0438\u044e \u0448\u043a\u043e\u043b\u044b"
  }
};

const $ = id => document.getElementById(id);
const list = $('list'), q = $('q'), clear = $('clear');
const tabs = [...document.querySelectorAll('.tab')];
let grade = '7', lang = 'uz';
const t = () => T[lang];

const norm = s => (s||'').toLowerCase()
  .replace(/[\u2018\u2019`\u02bb\u02bc']/g,'')
  .replace(/o'/g,'o').replace(/g'/g,'g')
  .replace(/[^a-z0-9\u0430-\u044f\u0451 ]/gi,'').trim();

const tier = g => g >= 1 ? 'full' : (g >= 0.5 ? 'high' : 'std');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function hl(text, term){
  if(!term) return esc(text);
  const n = norm(text), k = norm(term);
  if(!k) return esc(text);
  const i = n.indexOf(k);
  if(i < 0) return esc(text);
  let raw = 0, seen = 0;
  while(raw < text.length && seen < i){ if(norm(text[raw])) seen++; raw++; }
  let end = raw, got = 0;
  while(end < text.length && got < k.length){ if(norm(text[end])) got++; end++; }
  return esc(text.slice(0,raw)) + '<mark>' + esc(text.slice(raw,end)) + '</mark>' + esc(text.slice(end));
}

function chrome(){
  const x = t();
  document.documentElement.lang = lang;
  $('h1a').textContent = x.h1a; $('h1b').textContent = x.h1b;
  $('lede').textContent = x.lede;
  tabs[0].textContent = x.g7; tabs[1].textContent = x.g8; tabs[2].textContent = x.g9;
  q.placeholder = x.ph; q.setAttribute('aria-label', x.ph);
  $('c-band').textContent = x.cBand; $('c-title').textContent = x.cTitle;
  $('c-nat').textContent = x.cNat; $('c-text').textContent = x.cText;
  $('n-title').textContent = x.nTitle; $('n-text').textContent = x.nText;
  $('n-exp').innerHTML = x.nExp; $('n-exp').style.display = dual(grade) ? '' : 'none';
  $('scoring').innerHTML = x.scoring[grade].map(([a,b]) => `<span>${a} <b>${b}</b></span>`).join('');
  $('k-who').textContent = x.kWho; $('k-pct').textContent = x.kPct; $('k-grant').textContent = x.kGrant;
  $('b-kicker').textContent = x.bKick; $('b-title').textContent = x.bTitle;
  $('f-text').textContent = x.foot;
  $('p-title').textContent = x.pTitle; $('p-note').textContent = x.pNote;
  $('p1-name').textContent = x.p1Name;
  $('p1-price').textContent = x.p1Price; $('p1-unit').textContent = x.pUnit;
  $('p2-name').textContent = x.p2Name;
  $('p2-price').textContent = x.p2Price; $('p2-unit').textContent = x.pUnit;
  const subjLi = (arr, note) => arr.map((s,i) => `<li style="--i:${i}">${s}</li>`).join('') +
    (note ? `<li class="subj-note" style="--i:${arr.length}">\u2014 ${note}</li>` : '');
  $('p1-subj').innerHTML = subjLi(x.p1Subj, x.p1SubjNote);
  $('p2-subj').innerHTML = subjLi(x.p2Subj, '');
}

function render(){
  const x = t(), term = q.value.trim(), k = norm(term);
  const rows = DATA[grade].map((r,i) => ({...r, rank:i+1}))
    .filter(r => !k || norm(r.s+' '+r.n).includes(k) || norm(r.n+' '+r.s).includes(k));


  if(!rows.length){
    list.innerHTML = `<div class="empty"><b>${x.emptyT}</b>${x.emptyS}</div>`;
    return;
  }
  list.innerHTML = rows.map(r => `
  <article class="row" data-top="${r.rank<=3?1:0}">
    <button class="head" type="button" aria-expanded="false">
      <span class="rank">${r.rank}</span>
      <span class="who">
        <span class="name"><span class="fam">${hl(r.s, term)}</span> <span class="giv">${hl(r.n, term)}</span></span>
        <span class="meter"><i style="width:${r.t}%"></i></span>
      </span>
      <span class="right">
        <span class="pct">${r.t}</span>
        ${grants(r, x)}
        <span class="chev"></span>
      </span>
    </button>
    <div class="body">
      ${subj(x.subj[0], r.m, QN.m, x)}${subj(x.subj[1], r.e, QN.e, x)}${subj(x.subj[2], r.o, QN.o, x)}
    </div>
  </article>`).join('');
}

const dual = g => g === '7' || g === '8';
const chip = (lbl, v, x) => v == null
  ? `<span class="grant" data-t="none"><span class="grant-lbl">${lbl}</span>${x.noGrant}</span>`
  : `<span class="grant" data-t="${tier(v)}"><span class="grant-lbl">${lbl}</span>${Math.round(v*100)}%</span>`;
const grants = (r, x) => dual(grade)
  ? `<span class="grants">${chip(x.lblNat, r.gr, x)}${chip(x.lblCam, r.cb, x)}</span>`
  : `<span class="grant" data-t="${tier(r.gr)}"><span class="grant-lbl">${x.grantLbl}</span>${Math.round(r.gr*100)}%</span>`;

const subj = (name, ok, qn, x) => `<div class="subj">
  <span class="subj-n">${name}<i class="of">${qn} ${x.qWord}</i></span>
  <span class="track"><i style="width:${(ok/qn*100).toFixed(0)}%"></i></span>
  <span class="subj-v"><b>${ok}</b> ${x.okWord}<i>${qn-ok} ${x.noWord}</i></span></div>`;


list.addEventListener('click', e => {
  const btn = e.target.closest('.head'); if(!btn) return;
  const row = btn.closest('.row');
  btn.setAttribute('aria-expanded', row.classList.toggle('open'));
});
tabs.forEach(b => b.addEventListener('click', () => {
  tabs.forEach(x => x.setAttribute('aria-selected', x === b));
  grade = b.dataset.g; chrome(); render();
  window.scrollTo({top:0, behavior:'smooth'});
}));
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.l;
  document.querySelectorAll('.lang button').forEach(x => x.setAttribute('aria-pressed', x === b));
  const bc = $('beacon');
if('IntersectionObserver' in window){
  new IntersectionObserver((e,o) => e.forEach(x => {
    if(x.isIntersecting){ x.target.classList.add('in'); o.unobserve(x.target); }
  }), {threshold:.25}).observe(bc);
} else { bc.classList.add('in'); }

chrome(); render();
}));
q.addEventListener('input', () => { clear.classList.toggle('on', !!q.value); render(); });
clear.addEventListener('click', () => { q.value=''; clear.classList.remove('on'); render(); q.focus(); });

const bc = $('beacon');
if('IntersectionObserver' in window){
  new IntersectionObserver((e,o) => e.forEach(x => {
    if(x.isIntersecting){ x.target.classList.add('in'); o.unobserve(x.target); }
  }), {threshold:.25}).observe(bc);
} else { bc.classList.add('in'); }

chrome(); render();
</script>
</body>
</html>
