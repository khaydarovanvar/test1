<style>
:root{
  --paper:#FBFAF6;
  --panel:#FFFFFF;
  --panel-2:#F2F0E9;
  --ink:#14213D;
  --graphite:#55607A;
  --faint:#8B94A9;
  --grid:#CBD8EA;
  --rule:#E4E0D5;
  --pen:#C81E3C;
  --gold:#B8801B;
  --good:#157F63;
  --sA:#2F5D9E;
  --sB:#1F8A70;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 12px 32px -18px rgba(20,33,61,.35);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1524; --panel:#16203A; --panel-2:#1B2745;
    --ink:#E9EEF8; --graphite:#A3AFC7; --faint:#7C88A2;
    --grid:#22314F; --rule:#2A3859;
    --pen:#FF6079; --gold:#E9BE5C; --good:#3FBF9A;
    --sA:#5B8FD6; --sB:#2BA085;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -20px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1524; --panel:#16203A; --panel-2:#1B2745;
  --ink:#E9EEF8; --graphite:#A3AFC7; --faint:#7C88A2;
  --grid:#22314F; --rule:#2A3859;
  --pen:#FF6079; --gold:#E9BE5C; --good:#3FBF9A;
  --sA:#5B8FD6; --sB:#2BA085;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--paper);
  background-image:
    linear-gradient(to right,var(--grid) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  font-family:Karla,"Segoe UI",system-ui,sans-serif;
  font-size:clamp(15px,1.05vw + 9px,19px);
  line-height:1.55;
  margin:0;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0 auto 0 clamp(18px,4.5vw,72px);
  width:2px;background:var(--pen);opacity:.5;z-index:2;pointer-events:none;
}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:800;text-wrap:balance;margin:0;line-height:1.05;letter-spacing:-.015em}
h1{font-size:clamp(2.4rem,6.2vw,5rem)}
h2{font-size:clamp(1.8rem,3.6vw,3.1rem)}
h3{font-size:clamp(1.05rem,1.5vw,1.35rem);font-weight:600;letter-spacing:-.005em}
p{margin:0;max-width:64ch}
b,strong{font-weight:800}
em{font-style:italic}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.note{font-family:Caveat,cursive;color:var(--pen);font-size:clamp(1.15rem,1.9vw,1.7rem);line-height:1.2;transform:rotate(-1.4deg);display:inline-block}
.eyebrow{
  font-family:"JetBrains Mono",monospace;font-size:.72rem;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--pen);
}
.lede{font-size:clamp(1.05rem,1.5vw,1.3rem);color:var(--graphite);max-width:58ch}

/* ---------- deck shell ---------- */
#deck{position:relative;overflow-x:clip}
.slide{
  min-height:100svh;
  display:none;
  flex-direction:column;
  justify-content:center;
  gap:clamp(14px,2.2vh,26px);
  padding:clamp(64px,7vh,88px) clamp(28px,7vw,110px) clamp(84px,10vh,104px);
  max-width:1180px;
  margin-inline:auto;
}
.slide.on{display:flex;animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .slide.on{animation:none}
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}

/* ---------- HUD ---------- */
.hud{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px clamp(14px,3vw,26px);
  background:linear-gradient(var(--paper) 55%,transparent);
  pointer-events:none;
}
.hud > *{pointer-events:auto}
.brand{
  font-family:"JetBrains Mono",monospace;font-size:.7rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);padding-left:clamp(28px,4.5vw,58px);
}
.hud-r{display:flex;align-items:center;gap:8px}
.btn{
  font-family:"JetBrains Mono",monospace;font-size:.74rem;font-weight:700;
  letter-spacing:.06em;border:1px solid var(--rule);background:var(--panel);
  color:var(--graphite);border-radius:8px;padding:7px 10px;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
}
.btn:hover{border-color:var(--pen);color:var(--pen)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--pen);outline-offset:3px;border-radius:6px}
.count{font-family:"JetBrains Mono",monospace;font-size:.74rem;color:var(--faint);min-width:52px;text-align:right}

/* ---------- footer nav ---------- */
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;align-items:center;gap:14px;
  padding:10px clamp(14px,3vw,26px);
  background:linear-gradient(transparent,var(--paper) 45%);
  pointer-events:none;
}
.foot > *{pointer-events:auto}
.ticks{display:flex;gap:4px;flex:1;padding-left:clamp(28px,4.5vw,58px);flex-wrap:wrap}
.tick{width:22px;height:6px;border-radius:2px;background:var(--rule);border:0;padding:0;cursor:pointer;transition:background .2s,transform .2s}
.tick:hover{transform:scaleY(1.6)}
.tick.done{background:var(--graphite);opacity:.5}
.tick.here{background:var(--pen)}
.arrows{display:flex;gap:6px}
.arrow{width:38px;height:34px;display:grid;place-items:center;font-size:1rem}

/* ---------- surfaces ---------- */
.card{
  background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  padding:clamp(14px,1.6vw,22px);box-shadow:var(--shadow);
}
.grid2{display:grid;gap:clamp(12px,1.6vw,20px);grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid3{display:grid;gap:clamp(10px,1.2vw,16px);grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:clamp(10px,1.6vh,18px)}
.scroll-x{overflow-x:auto}
.hero-num{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(2rem,4.6vw,3.4rem);line-height:1;font-variant-numeric:tabular-nums}

/* ---------- interactive bits ---------- */
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  padding:13px 15px;cursor:pointer;color:inherit;font:inherit;
  transition:border-color .16s,background .16s,transform .16s;
}
.opt:hover{border-color:var(--pen);transform:translateX(3px)}
.opt .key{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--faint);flex:none}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--panel))}
.opt.correct .key{color:var(--good)}
.opt.wrong{border-color:var(--pen);background:color-mix(in srgb,var(--pen) 8%,var(--panel))}
.opt.wrong .key{color:var(--pen)}
.opt[disabled]{cursor:default;transform:none}
.verdict{
  border-left:3px solid var(--pen);padding:2px 0 2px 14px;color:var(--graphite);
  display:none;max-width:66ch;
}
.verdict.show{display:block;animation:rise .3s both}
.pill{
  font-family:"JetBrains Mono",monospace;font-size:.68rem;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid var(--rule);
  color:var(--graphite);white-space:nowrap;
}
.pill.hot{border-color:var(--pen);color:var(--pen)}
.pill.mid{border-color:var(--gold);color:var(--gold)}
.pill.no{opacity:.6}
label.field{display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--graphite);font-weight:600}
label.field .val{font-family:"JetBrains Mono",monospace;color:var(--ink);font-weight:700}
input[type=range]{width:100%;accent-color:var(--pen);cursor:pointer}
input[type=text],input[type=number]{
  font-family:"JetBrains Mono",monospace;font-size:1.1rem;padding:9px 12px;border-radius:10px;
  border:1px solid var(--rule);background:var(--panel);color:var(--ink);width:100%;max-width:260px;
}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--graphite)}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
figure{margin:0}
figcaption{font-size:.8rem;color:var(--faint);margin-top:8px}
.chart{width:100%;height:auto;display:block;touch-action:none}
.tag{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--panel);
  border-radius:999px;padding:7px 13px;font-size:.85rem;font-weight:600;cursor:pointer;color:inherit;
  transition:border-color .15s,background .15s;
}
.tag:hover{border-color:var(--pen)}
.tag[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
ul.clean{margin:0;padding-left:1.1em;color:var(--graphite);display:flex;flex-direction:column;gap:6px}
ul.clean b{color:var(--ink)}
.check{display:flex;gap:11px;align-items:flex-start;cursor:pointer;padding:8px 0;border-bottom:1px dashed var(--rule)}
.check input{margin-top:4px;accent-color:var(--pen);width:17px;height:17px;flex:none;cursor:pointer}
.check.done span{opacity:.5;text-decoration:line-through}
.strike{position:relative;display:inline-block}
.strike::after{
  content:"";position:absolute;left:-2%;right:-2%;top:52%;height:3px;background:var(--pen);
  transform:scaleX(0);transform-origin:left;border-radius:2px;
}
.slide.on .strike::after{animation:sweep .6s .5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes sweep{to{transform:scaleX(1)}}
.circle-wrap{position:relative;display:inline-block}
.circle-wrap svg{position:absolute;inset:-24% -11%;width:122%;height:148%;overflow:visible;pointer-events:none}
.circle-wrap path{fill:none;stroke:var(--pen);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1100;stroke-dashoffset:1100;opacity:.85}
.slide.on .circle-wrap path{animation:draw 1.1s .7s cubic-bezier(.5,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bar-track{height:12px;border-radius:6px;background:var(--panel-2);overflow:hidden;flex:1;min-width:80px}
.bar-fill{height:100%;background:var(--pen);border-radius:6px;width:0;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.digits{
  font-family:"JetBrains Mono",monospace;font-weight:700;letter-spacing:.22em;
  font-size:clamp(2rem,5vw,3.6rem);color:var(--ink);min-height:1.2em;
}
.hint{font-size:.85rem;color:var(--faint)}
.kbd{font-family:"JetBrains Mono",monospace;font-size:.72rem;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--graphite)}
#poll .row{flex-wrap:nowrap}
@media (max-width:640px){
  #poll .row{flex-wrap:wrap}
  #poll .bar-track{order:5;flex-basis:100%}
  body::before{display:none}
  .brand,.ticks{padding-left:0}
  .slide{padding:70px 20px 90px}
}
</style>
<style>
.tool{text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .16s,transform .16s}
.tool:hover{border-color:var(--pen);transform:translateY(-2px)}
.tool .more{display:none;border-top:1px dashed var(--rule);padding-top:10px;margin-top:2px;font-size:.9rem;color:var(--graphite)}
.tool.open .more{display:flex;flex-direction:column;gap:8px;animation:rise .28s both}
.tool .num{font-family:"JetBrains Mono",monospace;font-size:.7rem;color:var(--pen);letter-spacing:.12em;font-weight:700}
.tool .more b{color:var(--ink);font-weight:800;display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.band{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:baseline}
.band .lbl{font-family:"JetBrains Mono",monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;white-space:nowrap}
.split{display:grid;gap:10px 22px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.split .col{display:flex;flex-direction:column;gap:10px}
.arrow-row{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--rule)}
.arrow-row .to{color:var(--pen);font-family:"JetBrains Mono",monospace;font-weight:700}
.job{display:none}
.job.on{display:flex;flex-direction:column;gap:12px;animation:rise .3s both}
.tally{font-family:"JetBrains Mono",monospace;font-size:.82rem;color:var(--graphite);display:flex;gap:18px;flex-wrap:wrap}
.tally b{color:var(--ink)}
.big-eq{font-family:"JetBrains Mono",monospace;font-size:clamp(1rem,2.1vw,1.5rem);font-weight:700;letter-spacing:.02em;color:var(--ink)}
.pair{display:flex;gap:6px;flex-wrap:wrap;font-family:"JetBrains Mono",monospace;font-size:.9rem}
.pair span{background:var(--panel-2);border-radius:6px;padding:3px 8px;opacity:0;animation:pop .3s forwards}
@keyframes pop{to{opacity:1}}
</style>

<main id="deck">

<!-- 0 ─ TITLE -->
<section class="slide">
  <div class="eyebrow" data-i18n data-en="First lesson of the year" data-uz="Yilning birinchi darsi"></div>
  <h1><span class="circle-wrap"><span data-i18n data-en="Why do we learn math?" data-uz="Nega matematika kerak?"></span><svg viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true"><path d="M22 62 C22 22 118 10 206 12 C312 14 386 30 384 62 C382 96 286 112 196 110 C96 108 20 96 24 66 C28 44 82 26 150 22"/></svg></span></h1>
  <p class="lede" data-i18n data-en="No slogans. No “you’ll need it one day.” Today we look at the honest answer — including the parts where you are right and I am not going to argue." data-uz="Shiorlarsiz. “Bir kun kerak bo‘ladi” degan gapsiz. Bugun halol javobni ko‘ramiz — siz haq bo‘lgan joylarni ham men inkor qilmayman."></p>
  <div class="row" style="margin-top:6px">
    <span class="note" data-i18n data-en="Bring your honest opinion →" data-uz="Halol fikringizni olib keling →"></span>
  </div>
  <p class="hint" style="margin-top:auto"><span data-i18n data-en="Move with" data-uz="Boshqarish:"></span> <span class="kbd">→</span> <span class="kbd">←</span> <span class="kbd">Space</span> · <span data-i18n data-en="tap the arrows below" data-uz="pastdagi strelkalar"></span></p>
</section>

<!-- 1 ─ POLL -->
<section class="slide">
  <div class="eyebrow" data-i18n data-en="Question for you · 01" data-uz="Sizga savol · 01"></div>
  <h2 data-i18n data-en="Be honest. How useful is math for <em>your</em> future?" data-uz="Halol ayting. Matematika <em>sizning</em> kelajagingizga qanchalik kerak?"></h2>
  <p class="lede" data-i18n data-en="Hands up. I count, I write it down, and nobody is wrong here. This number is our starting point — we will look at it again in 40 minutes." data-uz="Qo‘l ko‘taring. Men sanayman va yozib qo‘yaman — bu yerda noto‘g‘ri javob yo‘q. Bu raqam — boshlang‘ich nuqtamiz, 40 daqiqadan keyin yana qaraymiz."></p>
  <div class="card stack" id="poll" style="max-width:760px"></div>
  <div class="row">
    <button class="btn" id="pollReset" type="button" data-i18n data-en="RESET" data-uz="TOZALASH"></button>
    <span class="note" data-i18n data-en="Answer “zero” if that is the truth. I want the truth." data-uz="Agar rost shunday bo‘lsa, “umuman” deng. Menga rost kerak."></span>
  </div>
</section>

<!-- 2 ─ THE ADMISSION -->
<section class="slide">
  <div class="eyebrow" data-i18n data-en="The honest part · 02" data-uz="Halol qism · 02"></div>
  <h2 data-i18n data-en="You are right: <span class='strike'>you will use integrals every day</span>" data-uz="Siz haqsiz: <span class='strike'>integral har kuni kerak bo‘ladi</span>"></h2>
  <p class="lede" data-i18n data-en="Most of you will finish school and never compute an integral again. A teacher who denies that is lying, and you can tell. So let me sort the course honestly:" data-uz="Ko‘pchiligingiz maktabni tugatib, boshqa hech qachon integral hisoblamaysiz. Buni inkor qilgan o‘qituvchi yolg‘on gapiradi — siz buni sezasiz. Shuning uchun kursni halol ajratamiz:"></p>
  <div class="card band">
    <div class="lbl" style="color:var(--pen)" data-i18n data-en="Every week, for life" data-uz="Har hafta, umr bo‘yi"></div>
    <div data-i18n data-en="Percentages · proportion · estimating in your head · reading a chart · probability · “does this number make sense?”" data-uz="Foizlar · nisbat · og‘zaki chamalash · grafikni o‘qish · ehtimollik · “bu raqam mantiqqa to‘g‘ri keladimi?”"></div>
    <div class="lbl" style="color:var(--gold)" data-i18n data-en="Sometimes" data-uz="Ba’zan"></div>
    <div data-i18n data-en="Algebra as a model of a real situation · geometry and area · statistics · systems of equations" data-uz="Real vaziyat modeli sifatidagi algebra · geometriya va yuza · statistika · tenglamalar sistemasi"></div>
    <div class="lbl" style="color:var(--faint)" data-i18n data-en="Almost never — unless" data-uz="Deyarli hech qachon — agar"></div>
    <div data-i18n data-en="Integrals · trig identities · matrices — <b>unless</b> you go into engineering, architecture, physics, economics, programming, medicine research or design." data-uz="Integrallar · trigonometrik ayniyatlar · matritsalar — <b>agar</b> muhandislik, arxitektura, fizika, iqtisod, dasturlash, tibbiy tadqiqot yoki dizaynga bormasangiz."></div>
  </div>
  <p class="lede" data-i18n data-en="So one honest question stays on the table: if a part of this course is “almost never”, why are we doing it at all?" data-uz="Demak, bitta halol savol qoladi: agar kursning bir qismi “deyarli hech qachon” bo‘lsa, nega uni umuman o‘qiymiz?"></p>
</section>

<!-- 3 ─ THE GYM -->
<section class="slide">
  <div class="eyebrow" data-i18n data-en="The answer · 03" data-uz="Javob · 03"></div>
  <h2 data-i18n data-en="Name one real moment when you must lift a heavy metal bar over your head." data-uz="Hayotda og‘ir temir shtangani bosh uzra ko‘tarishingiz shart bo‘lgan bitta holatni ayting."></h2>
  <p class="lede" data-i18n data-en="There isn’t one. Nobody here will ever need that movement — yet the strongest, healthiest people alive do it on purpose, every week." data-uz="Bunday holat yo‘q. Bu yerdagi hech kimga bu harakat kerak emas — shunga qaramay, dunyodagi eng kuchli odamlar buni har hafta ataylab qiladi."></p>
  <p class="lede" data-i18n data-en="So why do they do it? Because the bar is not the point. What the bar builds is the point." data-uz="Xo‘sh, nega qiladi? Chunki gap shtangada emas. Gap shtanga qurgan narsada."></p>
  <span class="note" data-i18n data-en="Same question, one word changed: what does this build?" data-uz="O‘sha savol, bitta so‘z o‘zgardi: bu nimani quradi?"></span>
</section>

<!-- 3b ─ TRANSFER -->
<section class="slide">
  <div class="eyebrow" data-i18n data-en="What it builds · 03" data-uz="U nima quradi · 03"></div>
  <h2 data-i18n data-en="The exercise is never the reason. The transfer is." data-uz="Mashqning o‘zi hech qachon maqsad emas. Maqsad — o‘tkazma."></h2>
  <div class="card stack" style="max-width:860px">
    <div class="arrow-row">
      <div data-i18n data-en="<b>Lifting the barbell</b>" data-uz="<b>Shtanga ko‘tarish</b>"></div><div class="to">→</div>
      <div data-i18n data-en="carrying your little brother, moving furniture, a back that doesn’t hurt at 40" data-uz="ukangizni ko‘tarish, mebel surish, 40 yoshda og‘rimaydigan bel"></div>
    </div>
    <div class="arrow-row">
      <div data-i18n data-en="<b>Solving an integral</b>" data-uz="<b>Integral yechish</b>"></div><div class="to">→</div>
      <div data-i18n data-en="holding five steps in your head at once, seeing the structure under a mess, not panicking at a hard problem" data-uz="beshta qadamni bir vaqtda boshda ushlab turish, chalkashlik ostidagi tuzilmani ko‘rish, qiyin masaladan qo‘rqmaslik"></div>
    </div>

function go(i){
  at = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach(function(s, k){ s.classList.toggle("on", k === at); });
  Array.prototype.forEach.call(ticks.children, function(t, k){
    t.classList.toggle("here", k === at);
    t.classList.toggle("done", k < at);
  });
  document.getElementById("cur").textContent = at + 1;
  window.scrollTo(0, 0);
  try { localStorage.setItem("wm-at", String(at)); } catch (e) {}
}
document.getElementById("next").addEventListener("click", function(){ go(at + 1); });
document.getElementById("prev").addEventListener("click", function(){ go(at - 1); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName;
  if (t === "INPUT" || t === "TEXTAREA") { if (e.key !== "Escape") return; }
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(at + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(at - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(slides.length - 1);
});
var tsx = 0, tsy = 0;
document.addEventListener("touchstart", function(e){ tsx = e.changedTouches[0].clientX; tsy = e.changedTouches[0].clientY; }, {passive:true});
document.addEventListener("touchend", function(e){
  var dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) go(at + (dx < 0 ? 1 : -1));
}, {passive:true});
document.getElementById("full").addEventListener("click", function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
});

/* ───────────── svg helpers ───────────── */
var NS = "http://www.w3.org/2000/svg";
function sv(name, attrs){
  var n = document.createElementNS(NS, name);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function clear(n){ while (n.firstChild) n.removeChild(n.firstChild); }
function money(v){
  if (LANG === "uz") {
    if (v >= 1e9) return (v / 1e9).toFixed(v < 1e10 ? 2 : 1).replace(".", ",") + " mlrd";
    if (v >= 1e6) return (v / 1e6).toFixed(v < 1e7 ? 1 : 0).replace(".", ",") + " mln";
    return Math.round(v / 1e3) + " ming";
  }
  if (v >= 1e9) return (v / 1e9).toFixed(v < 1e10 ? 2 : 1) + "bn";
  if (v >= 1e6) return (v / 1e6).toFixed(v < 1e7 ? 1 : 0) + "M";
  return Math.round(v / 1e3) + "K";
}

/* ───────────── 08 · savings ───────────── */
var mA = document.getElementById("mA"), mY = document.getElementById("mY"), mR = document.getElementById("mR"),
    mChart = document.getElementById("mChart");
function fv(P, i, n){ return i === 0 ? P * n : P * ((Math.pow(1 + i, n) - 1) / i) * (1 + i); }
function drawMoney(){
  var P = +mA.value, Y = +mY.value, r = +mR.value, i = r / 100 / 12;
  document.getElementById("mAv").textContent = money(P) + " so‘m";
  document.getElementById("mYv").textContent = Y;
  document.getElementById("mRv").textContent = r;
  var pts = [], maxV = 0;
  for (var y = 0; y <= Y; y++) {
    var m = y * 12, d = P * m, t = fv(P, i, m);
    pts.push({ y: y, d: d, t: t }); if (t > maxV) maxV = t;
  }
  var last = pts[pts.length - 1];
  document.getElementById("mIn").textContent = money(last.d);
  document.getElementById("mInt").textContent = money(last.t - last.d);
  document.getElementById("mTot").textContent = money(last.t) + " so‘m";

  var W = 520, H = 300, L = 62, R = 78, Tp = 16, B = 34;
  var X = function(y){ return L + (Y === 0 ? 0 : y / Y) * (W - L - R); };
  var Yy = function(v){ return H - B - (maxV === 0 ? 0 : v / maxV) * (H - Tp - B); };
  clear(mChart);

  for (var g = 0; g <= 4; g++) {
    var vv = maxV * g / 4, yy = Yy(vv);
    mChart.appendChild(sv("line", { x1: L, x2: W - R, y1: yy, y2: yy, stroke: "var(--rule)", "stroke-width": 1 }));
    var lb = sv("text", { x: L - 8, y: yy + 4, "text-anchor": "end", fill: "var(--faint)", "font-size": 11, "font-family": "JetBrains Mono, monospace" });
    lb.textContent = g === 0 ? "0" : money(vv); mChart.appendChild(lb);
  }
  [0, Math.round(Y / 2), Y].forEach(function(y){
    if (Y < 2 && y !== Y) return;
    var t = sv("text", { x: X(y), y: H - 12, "text-anchor": "middle", fill: "var(--faint)", "font-size": 11, "font-family": "JetBrains Mono, monospace" });
    t.textContent = y + (LANG === "uz" ? " y." : "y"); mChart.appendChild(t);
  });

  function area(key){
    var d = "M" + X(0) + " " + Yy(0);
    pts.forEach(function(p){ d += " L" + X(p.y).toFixed(1) + " " + Yy(p[key]).toFixed(1); });
    d += " L" + X(Y) + " " + Yy(0) + " Z"; return d;
  }
  mChart.appendChild(sv("path", { d: area("t"), fill: "var(--sB)", "fill-opacity": .9 }));
  mChart.appendChild(sv("path", { d: area("d"), fill: "var(--sA)", "fill-opacity": .95 }));
  var dl = "M" + pts.map(function(p){ return X(p.y).toFixed(1) + " " + Yy(p.d).toFixed(1); }).join(" L");
  mChart.appendChild(sv("path", { d: dl, fill: "none", stroke: "var(--panel)", "stroke-width": 2 }));

  var midInt = (Yy(last.t) + Yy(last.d)) / 2, midDep = (Yy(last.d) + Yy(0)) / 2;
  if (Yy(last.d) - Yy(last.t) > 16) {
    var t1 = sv("text", { x: W - R + 8, y: midInt + 4, fill: "var(--sB)", "font-size": 11, "font-weight": 700, "font-family": "Karla, sans-serif" });
    t1.textContent = T("interest", "foiz"); mChart.appendChild(t1);
  }
  if (Yy(0) - Yy(last.d) > 16) {
    var t2 = sv("text", { x: W - R + 8, y: midDep + 4, fill: "var(--sA)", "font-size": 11, "font-weight": 700, "font-family": "Karla, sans-serif" });
    t2.textContent = T("yours", "o‘zingiz"); mChart.appendChild(t2);
  }

  var hov = sv("g", { opacity: 0 });
  var vline = sv("line", { y1: Tp, y2: H - B, stroke: "var(--ink)", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: .5 });
  var dot1 = sv("circle", { r: 4.5, fill: "var(--sA)", stroke: "var(--panel)", "stroke-width": 2 });
  var dot2 = sv("circle", { r: 4.5, fill: "var(--sB)", stroke: "var(--panel)", "stroke-width": 2 });
  var box = sv("rect", { rx: 6, fill: "var(--panel)", stroke: "var(--rule)", width: 118, height: 40 });
  var l1 = sv("text", { "font-size": 11, "font-family": "JetBrains Mono, monospace", fill: "var(--ink)", "font-weight": 700 });
  var l2 = sv("text", { "font-size": 11, "font-family": "JetBrains Mono, monospace", fill: "var(--graphite)" });
  [vline, box, l1, l2, dot1, dot2].forEach(function(n){ hov.appendChild(n); });
  mChart.appendChild(hov);
  var hit = sv("rect", { x: L, y: Tp, width: W - L - R, height: H - Tp - B, fill: "transparent", style: "cursor:crosshair" });
  mChart.appendChild(hit);
  hit.addEventListener("pointermove", function(e){
    var bb = mChart.getBoundingClientRect(), px = (e.clientX - bb.left) / bb.width * W;
    var y = Math.max(0, Math.min(Y, Math.round((px - L) / (W - L - R) * Y))), p = pts[y];
    hov.setAttribute("opacity", 1);
    vline.setAttribute("x1", X(y)); vline.setAttribute("x2", X(y));
    dot1.setAttribute("cx", X(y)); dot1.setAttribute("cy", Yy(p.d));
    dot2.setAttribute("cx", X(y)); dot2.setAttribute("cy", Yy(p.t));
    var bx = Math.min(W - R - 118, Math.max(L, X(y) - 59));
    box.setAttribute("x", bx); box.setAttribute("y", Tp + 2);
    l1.setAttribute("x", bx + 9); l1.setAttribute("y", Tp + 19);
    l2.setAttribute("x", bx + 9); l2.setAttribute("y", Tp + 34);
    l1.textContent = (LANG === "uz" ? y + "-yil: " : "Year " + y + ": ") + money(p.t);
    l2.textContent = money(p.d) + " + " + money(p.t - p.d);
  });
  hit.addEventListener("pointerleave", function(){ hov.setAttribute("opacity", 0); });
}
[mA, mY, mR].forEach(function(n){ n.addEventListener("input", drawMoney); });

    t.textContent = v; bChart.appendChild(t);
  });
  bChart.appendChild(sv("line", { x1: L, x2: W - R, y1: Yy(.5), y2: Yy(.5), stroke: "var(--graphite)", "stroke-width": 1, "stroke-dasharray": "4 4", opacity: .7 }));
  var ln = [], ar = "M" + L + " " + Yy(0);
  for (var v = N0; v <= N1; v++) { var yv = pShare(v); ln.push(X(v).toFixed(1) + " " + Yy(yv).toFixed(1)); ar += " L" + X(v).toFixed(1) + " " + Yy(yv).toFixed(1); }
  ar += " L" + X(N1) + " " + Yy(0) + " Z";
  bChart.appendChild(sv("path", { d: ar, fill: "var(--pen)", "fill-opacity": .1 }));
  bChart.appendChild(sv("path", { d: "M" + ln.join(" L"), fill: "none", stroke: "var(--pen)", "stroke-width": 2, "stroke-linejoin": "round" }));
  bChart.appendChild(sv("circle", { cx: X(n), cy: Yy(p), r: 6, fill: "var(--pen)", stroke: "var(--panel)", "stroke-width": 2 }));
  var lab = sv("text", { x: Math.min(W - R - 4, X(n) + 12), y: Math.max(Tp + 12, Yy(p) - 12), fill: "var(--ink)", "font-size": 13, "font-weight": 700, "font-family": "JetBrains Mono, monospace", "text-anchor": X(n) > W - 130 ? "end" : "start" });
  if (X(n) > W - 130) lab.setAttribute("x", X(n) - 12);
  lab.textContent = n + " → " + Math.round(p * 100) + "%";
  bChart.appendChild(lab);
  var hit = sv("rect", { x: L, y: Tp, width: W - L - R, height: H - Tp - B, fill: "transparent", style: "cursor:ew-resize" });
  bChart.appendChild(hit);
  function pick(e){
    var bb = bChart.getBoundingClientRect(), px = (e.clientX - bb.left) / bb.width * W;
    bR.value = Math.max(N0, Math.min(N1, Math.round(N0 + (px - L) / (W - L - R) * (N1 - N0))));
    drawBirthday();
  }
  hit.addEventListener("pointerdown", function(e){ hit.setPointerCapture(e.pointerId); pick(e); });
  hit.addEventListener("pointermove", function(e){ if (e.buttons) pick(e); });
}
bR.addEventListener("input", drawBirthday);
