<title>Anvarbek Khaydarov · Mathematics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   Anvarbek Khaydarov · Mathematics — design system
   ============================================================ */
:root{
  --paper:#FAF9F5; --surface:#FFFFFF; --surface-2:#F4F2EC; --surface-3:#EDEAE1;
  --ink:#12262C; --ink-soft:#2E464D; --muted:#5F7076; --faint:#8B9A9F;
  --rule:#E3E0D7; --rule-soft:#EFEDE5;
  --brand:#0E5C63; --brand-deep:#0A3F45; --brand-tint:#E4F0F0;
  --brass:#B0801F; --brass-tint:#F7EEDA;
  --easy:#3C7A50; --easy-tint:#E6F1E8;
  --med:#B0801F;  --med-tint:#F7EEDA;
  --hard:#A34430; --hard-tint:#F8E9E4;
  --cam:#3D6B4C; --uz:#2B4C7E;
  --shadow-s:0 1px 2px rgba(18,38,44,.06);
  --shadow-m:0 2px 4px rgba(18,38,44,.05),0 12px 28px -18px rgba(18,38,44,.35);
  --shadow-l:0 4px 8px rgba(18,38,44,.06),0 24px 56px -28px rgba(18,38,44,.4);
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Work Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:4px; --r-l:8px;
  --maxw:1180px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1618; --surface:#131F22; --surface-2:#18272B; --surface-3:#1E3035;
  --ink:#E6EBEA; --ink-soft:#C2CFCF; --muted:#8FA3A6; --faint:#6B8085;
  --rule:#25383D; --rule-soft:#1C2C30;
  --brand:#4FB0B4; --brand-deep:#7FCACC; --brand-tint:#122E31;
  --brass:#D9A946; --brass-tint:#2C2415;
  --easy:#6FBB84; --easy-tint:#16281B;
  --med:#D9A946;  --med-tint:#2C2415;
  --hard:#DE8168; --hard-tint:#2E1B15;
  --cam:#87BB97; --uz:#8DACD9;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 2px 4px rgba(0,0,0,.4),0 12px 28px -18px rgba(0,0,0,.8);
  --shadow-l:0 4px 8px rgba(0,0,0,.5),0 24px 56px -28px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --paper:#0D1618; --surface:#131F22; --surface-2:#18272B; --surface-3:#1E3035;
  --ink:#E6EBEA; --ink-soft:#C2CFCF; --muted:#8FA3A6; --faint:#6B8085;
  --rule:#25383D; --rule-soft:#1C2C30;
  --brand:#4FB0B4; --brand-deep:#7FCACC; --brand-tint:#122E31;
  --brass:#D9A946; --brass-tint:#2C2415;
  --easy:#6FBB84; --easy-tint:#16281B;
  --med:#D9A946;  --med-tint:#2C2415;
  --hard:#DE8168; --hard-tint:#2E1B15;
  --cam:#87BB97; --uz:#8DACD9;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 2px 4px rgba(0,0,0,.4),0 12px 28px -18px rgba(0,0,0,.8);
  --shadow-l:0 4px 8px rgba(0,0,0,.5),0 24px 56px -28px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility}
img,svg{max-width:100%}
a{color:var(--brand);text-decoration-color:color-mix(in srgb,var(--brand) 35%,transparent);
  text-underline-offset:3px}
a:hover{text-decoration-color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
.narrow{max-width:760px}

/* ---------- brand ---------- */
.brandmark{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
.brandmark svg{width:38px;height:38px;flex:none}
.brandmark>span{display:block}
.brandmark .bn{display:block;font-family:var(--serif);font-weight:600;font-size:16px;
  line-height:1.15;letter-spacing:-.01em;color:var(--ink)}
.brandmark .bs{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin-top:1px}

/* ---------- header ---------- */
.site-head{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--rule)}
.site-head .bar{display:flex;align-items:center;justify-content:space-between;gap:20px;
  height:68px;max-width:var(--maxw);margin:0 auto;padding:0 28px}
.nav{display:flex;align-items:center;gap:4px}
.nav a{font-size:13.5px;font-weight:500;color:var(--muted);text-decoration:none;
  padding:7px 12px;border-radius:var(--r);transition:.15s}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a.on{color:var(--ink);background:var(--surface-2)}
.themebtn{appearance:none;background:none;border:1px solid var(--rule);color:var(--muted);
  width:34px;height:34px;border-radius:var(--r);cursor:pointer;display:grid;place-items:center;
  transition:.15s;flex:none}
.themebtn:hover{color:var(--ink);border-color:var(--muted)}

/* ---------- typography ---------- */
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;
  text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,4.6vw,3.05rem);line-height:1.08}
h2{font-size:clamp(1.45rem,2.6vw,1.95rem);line-height:1.18}
h3{font-size:1.22rem;line-height:1.3}
h4{font-size:1.03rem;line-height:1.35}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted)}
.lede{font-family:var(--serif);font-size:1.14rem;line-height:1.65;color:var(--ink-soft);max-width:64ch}
.prose p{max-width:68ch;margin:0 0 1em}
.prose ul,.prose ol{max-width:68ch;padding-left:1.25em;margin:0 0 1em}
.prose li{margin-bottom:.4em}
.prose li::marker{color:var(--brand)}
.small{font-size:13.5px;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- math typography ---------- */
.m{font-family:var(--serif);font-style:italic;font-size:1.04em;letter-spacing:.005em}
.m .op,.m .n{font-style:normal}
.frac{display:inline-flex;flex-direction:column;vertical-align:-0.55em;text-align:center;
  margin:0 .18em;font-style:normal}
.frac>span:first-child{padding:0 .32em;border-bottom:1.2px solid currentColor;line-height:1.35}
.frac>span:last-child{padding:0 .32em;line-height:1.35}
.frac.sm{font-size:.9em}
.sqrt{display:inline-flex;align-items:flex-start;font-style:normal}
.sqrt>.rad{font-size:1.1em;line-height:1}
.sqrt>.body{border-top:1.1px solid currentColor;padding:.08em .18em 0 .1em;margin-top:.12em}
sup,sub{font-size:.72em;line-height:0}
.eq{display:block;font-family:var(--serif);font-size:1.12rem;text-align:center;
  margin:1.15em 0;padding:.55em 0;color:var(--ink)}
.eq.boxed{background:var(--brand-tint);border-left:3px solid var(--brand);
  border-radius:0 var(--r) var(--r) 0;padding:.85em 1.1em;text-align:left}

/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-l);
  box-shadow:var(--shadow-s);transition:.18s}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;
  border:1px solid currentColor;white-space:nowrap}
.chip.c-uz{color:var(--uz)} .chip.c-cam{color:var(--cam)}
.chip.c-easy{color:var(--easy)} .chip.c-med{color:var(--med)} .chip.c-hard{color:var(--hard)}
.chip.solid{border:0;background:var(--brand);color:#fff}
.btn{appearance:none;font-family:var(--sans);font-size:13.5px;font-weight:500;cursor:pointer;
  border-radius:var(--r);padding:8px 16px;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink);transition:.15s;display:inline-flex;
  align-items:center;gap:7px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff}
.btn.sm{font-size:12.5px;padding:5px 11px}
.rule{border:0;border-top:1px solid var(--rule);margin:2.5rem 0}
.grid{display:grid;gap:18px}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r-l);
  background:var(--surface)}
table{border-collapse:collapse;width:100%}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:500;text-align:left;padding:10px 14px;
  background:var(--surface-2);border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--rule-soft);vertical-align:top;font-size:14.5px}
tbody tr:last-child td{border-bottom:0}
footer.site-foot{margin-top:96px;border-top:1px solid var(--rule);background:var(--surface-2)}
footer.site-foot .inner{max-width:var(--maxw);margin:0 auto;padding:40px 28px;
  display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-start}
footer .fnote{font-size:13px;color:var(--muted);max-width:44ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;
  scroll-behavior:auto!important}}
@media (max-width:720px){.wrap{padding:0 18px}.site-head .bar{padding:0 18px;height:60px}
  .nav a{padding:6px 9px;font-size:13px}}
@media print{.site-head,.themebtn,.no-print{display:none!important}
  body{background:#fff}.card{box-shadow:none}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--rule)}
.hero .bg{position:absolute;inset:0;pointer-events:none;opacity:.5}
.hero .inner{position:relative;max-width:var(--maxw);margin:0 auto;padding:84px 28px 76px;
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px;align-items:center}
.hero h1{margin:18px 0 20px;max-width:15ch}
.hero h1 em{font-style:italic;color:var(--brand)}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.heromark{display:grid;place-items:center}
.heromark svg{width:min(300px,72vw);height:auto;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:38px;
  border-top:1px solid var(--rule)}
.stat{padding:16px 14px 4px 0;border-right:1px solid var(--rule)}
.stat:last-child{border-right:0;padding-right:0}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(2n){border-right:0}}
.stat b{display:block;font-family:var(--serif);font-size:1.7rem;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums}
.stat span{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted)}
@media (max-width:900px){.hero .inner{grid-template-columns:1fr;padding:52px 28px 48px;gap:32px}
  .heromark{order:-1;justify-items:start}.heromark svg{width:120px}}

/* ---------- section ---------- */
.section{padding:76px 0}
.section.tight{padding:48px 0}
.sechead{margin-bottom:32px}
.sechead .eyebrow{display:block;margin-bottom:12px}
.sechead p{color:var(--muted);max-width:62ch;margin:10px 0 0}

/* ---------- grade tiles ---------- */
.gradegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.gtile{display:block;text-decoration:none;color:inherit;position:relative;padding:22px 22px 20px;
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-l);
  box-shadow:var(--shadow-s);transition:.2s;overflow:hidden}
.gtile:hover{transform:translateY(-2px);box-shadow:var(--shadow-m);border-color:var(--brand)}
.gtile .gnum{font-family:var(--serif);font-size:3.1rem;font-weight:600;line-height:.9;
  letter-spacing:-.03em;color:var(--brand);font-variant-numeric:lining-nums}
.gtile .gname{font-family:var(--serif);font-size:1.06rem;font-weight:600;margin:12px 0 4px}
.gtile .gmeta{font-size:12.5px;color:var(--muted);line-height:1.5}
.gtile .gtag{position:absolute;top:16px;right:16px}
.gtile.soon{opacity:.72}
.gtile.soon .gnum{color:var(--faint)}
.gtile.live::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}

/* ---------- anatomy ---------- */
.anat{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:16px}
.acard{padding:24px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-l)}
.acard .n{font-family:var(--mono);font-size:11px;letter-spacing:.13em;color:var(--brass);
  margin-bottom:14px}
.acard h4{margin-bottom:8px}
.acard p{font-size:14px;color:var(--muted);margin:0}
.clock{display:flex;gap:2px;margin:18px 0 26px;border-radius:3px;overflow:hidden;height:32px;
  border:1px solid var(--rule)}
.clock div{display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.04em;color:#fff;white-space:nowrap;overflow:hidden;min-width:0;padding:0 2px}

/* ---------- stream cards ---------- */
.streamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.scard{padding:26px 28px;background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r-l);border-top:3px solid var(--sc,var(--brand))}
.scard .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--sc,var(--brand));margin-bottom:10px}
.scard h3{margin-bottom:10px}
.scard p{font-size:14.5px;color:var(--muted);margin:0 0 14px}
.scard .figs{font-family:var(--mono);font-size:12px;color:var(--ink);
  font-variant-numeric:tabular-nums;border-top:1px solid var(--rule-soft);padding-top:12px}

/* ---------- quarter / lesson list ---------- */
.qtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px}
.qtab{appearance:none;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:500;
  padding:8px 15px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);
  color:var(--muted);transition:.15s}
.qtab:hover{color:var(--ink);border-color:var(--muted)}
.qtab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.qtab:disabled{opacity:.45;cursor:not-allowed}
.llist{display:grid;gap:10px}
.lrow{display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;
  padding:15px 20px;background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r-l);text-decoration:none;color:inherit;transition:.16s}
.lrow:hover{border-color:var(--brand);transform:translateX(2px);box-shadow:var(--shadow-s)}
.lrow .ln{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
  text-align:center;padding:5px 0;background:var(--surface-2);border-radius:3px}
.lrow .lt{font-family:var(--serif);font-size:1.03rem;font-weight:600;line-height:1.3}
.lrow .lm{font-size:12.5px;color:var(--muted);margin-top:3px}
.lrow .lgo{color:var(--faint);flex:none}
.lrow:hover .lgo{color:var(--brand)}
.lrow.locked{opacity:.55;pointer-events:none}

/* ---------- lesson page ---------- */
.lhead{border-bottom:1px solid var(--rule);background:var(--surface-2)}
.lhead .inner{max-width:var(--maxw);margin:0 auto;padding:38px 28px 30px}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);
  margin-bottom:16px}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--brand)}
.lhead h1{font-size:clamp(1.6rem,3.4vw,2.4rem);max-width:22ch}
.ltags{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.lbody{max-width:var(--maxw);margin:0 auto;padding:0 28px;
  display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:52px;align-items:start}
.lmain{padding:40px 0 0;min-width:0}
.lside{position:sticky;top:88px;padding:40px 0 0}
@media (max-width:980px){.lbody{grid-template-columns:1fr;gap:0}
  .lside{position:static;padding-top:8px;order:-1}}
.sbox{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-l);
  padding:18px 20px;margin-bottom:14px}
.sbox h5{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:0 0 12px;font-weight:500}
.sbox ul{margin:0;padding-left:1.05em;font-size:13.5px}
.sbox li{margin-bottom:6px}
.sbox li::marker{color:var(--brand)}
.sbox .kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;
  padding:5px 0;border-bottom:1px solid var(--rule-soft)}
.sbox .kv:last-child{border-bottom:0}
.sbox .kv b{font-weight:500;color:var(--muted)}
.sbox .kv span{text-align:right;font-family:var(--mono);font-size:12px}
.tocnav a{display:block;font-size:13.5px;color:var(--muted);text-decoration:none;padding:5px 0;
  border-left:2px solid var(--rule);padding-left:12px;margin-left:-2px;transition:.15s}
.tocnav a:hover,.tocnav a.on{color:var(--brand);border-left-color:var(--brand)}

.lsec{margin-bottom:56px;scroll-margin-top:88px}
.lsec>h2{display:flex;align-items:center;gap:12px;margin-bottom:20px;
  padding-bottom:12px;border-bottom:2px solid var(--ink)}
.lsec>h2 .sn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--brass);
  border:1px solid var(--brass);border-radius:3px;padding:2px 7px;flex:none}

/* concept / example / note blocks */
.concept{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-l);
  padding:22px 26px;margin:22px 0}
.concept>h4{display:flex;align-items:center;gap:9px;margin-bottom:10px;color:var(--brand)}
.keybox{background:var(--brand-tint);border:1px solid color-mix(in srgb,var(--brand) 26%,transparent);
  border-radius:var(--r-l);padding:18px 22px;margin:22px 0}
.keybox .klabel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--brand);margin-bottom:8px}
.warn{background:var(--hard-tint);border-left:3px solid var(--hard);border-radius:0 var(--r) var(--r) 0;
  padding:14px 18px;margin:20px 0;font-size:14.5px}
.warn .wl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--hard);display:block;margin-bottom:5px}

.example{border:1px solid var(--rule);border-radius:var(--r-l);overflow:hidden;margin:24px 0;
  background:var(--surface)}
.example>.eh{background:var(--surface-2);padding:12px 20px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--rule)}
.example>.eh .et{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--brass)}
.example>.eh .eq2{font-family:var(--serif);font-size:1rem;font-weight:600}
.example>.eb{padding:18px 22px}
.steps{list-style:none;margin:0;padding:0;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:26px 1fr;gap:14px;
  padding:11px 0;border-bottom:1px dashed var(--rule-soft)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(st);font-family:var(--mono);font-size:11px;color:var(--brass);
  border:1px solid var(--brass);border-radius:50%;width:22px;height:22px;display:grid;
  place-items:center;margin-top:2px}
.steps .why{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.steps li[hidden]{display:none}

/* figures */
.fig{margin:30px auto;text-align:center;max-width:440px}
.fig svg{display:block;width:100%;max-width:400px;height:auto;margin:0 auto;color:var(--ink)}
.fig figcaption{font-size:13px;color:var(--muted);margin-top:12px;font-style:italic;
  line-height:1.5;max-width:44ch;margin-inline:auto}
.figrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:26px;
  margin:30px 0;max-width:100%}
.figrow .fig{margin:0;max-width:none}
.figrow .fig svg{max-width:260px}

/* interactive */
.ilab{border:1px solid var(--rule);border-radius:var(--r-l);overflow:hidden;margin:26px 0;
  background:var(--surface);box-shadow:var(--shadow-s)}
.ilab>.ih{background:linear-gradient(180deg,var(--surface-2),var(--surface));
  padding:14px 22px;border-bottom:1px solid var(--rule);display:flex;align-items:center;
  justify-content:space-between;gap:14px;flex-wrap:wrap}
.ilab>.ih .it{font-family:var(--serif);font-weight:600;font-size:1.02rem}
.ilab>.ih .ihint{font-size:12.5px;color:var(--muted)}
.ilab>.ib{padding:22px}
.ctrls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:18px}
.ctrl{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
.ctrl input[type=range]{width:132px;accent-color:var(--brand)}
.ctrl output{font-family:var(--mono);font-size:12.5px;color:var(--ink);min-width:34px;
  font-variant-numeric:tabular-nums}
.readout{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.rd{background:var(--surface-2);border:1px solid var(--rule);border-radius:var(--r);
  padding:7px 12px;font-size:13px}
.rd b{font-family:var(--mono);font-size:12px;color:var(--brand);font-variant-numeric:tabular-nums}
.stage{display:grid;place-items:center;background:var(--surface-2);border-radius:var(--r);
  padding:14px;overflow-x:auto}
.stage svg,.stage canvas{width:100%;max-width:560px;height:auto;touch-action:none}
.handle{cursor:grab;fill:var(--brand)}
.handle:active{cursor:grabbing}

/* practice */
.plevel{margin:28px 0}
.plevel>.ph{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.plevel>.ph h3{font-size:1.08rem}
.plevel>.ph .pc{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
.probs{list-style:none;counter-reset:pr;margin:0;padding:0;border:1px solid var(--rule);
  border-radius:var(--r-l);overflow:hidden;background:var(--surface)}
.probs>li{counter-increment:pr;display:grid;grid-template-columns:34px 1fr auto;gap:14px;
  align-items:start;padding:12px 18px;border-bottom:1px solid var(--rule-soft)}
.probs>li:last-child{border-bottom:0}
.probs>li::before{content:counter(pr) ".";font-family:var(--mono);font-size:12px;color:var(--muted);
  padding-top:2px;font-variant-numeric:tabular-nums}
.probs .pq{font-size:15px;line-height:1.55}
.probs .pa{display:none;margin-top:7px;font-size:13.5px;color:var(--easy);
  padding:7px 11px;background:var(--easy-tint);border-radius:var(--r)}
.probs.show .pa{display:block}
.probs .pa .al{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  opacity:.75;margin-right:7px}
.lv-easy{--lv:var(--easy);--lvt:var(--easy-tint)}
.lv-med{--lv:var(--med);--lvt:var(--med-tint)}
.lv-hard{--lv:var(--hard);--lvt:var(--hard-tint)}
.plevel .probs{border-left:3px solid var(--lv)}
.probs .pa{color:var(--lv);background:var(--lvt)}

/* homework */
.hw{background:var(--brass-tint);border:1px solid color-mix(in srgb,var(--brass) 32%,transparent);
  border-radius:var(--r-l);padding:22px 26px}
.hw h3{color:var(--brass);margin-bottom:6px}
.hw .hwt{font-size:13px;color:var(--muted);margin-bottom:14px}
.hw ol{margin:0;padding-left:1.2em}
.hw li{margin-bottom:8px;font-size:14.5px}
.hw li::marker{color:var(--brass);font-family:var(--mono);font-size:12px}

/* quiz */
.quiz{display:grid;gap:14px}
.qitem{border:1px solid var(--rule);border-radius:var(--r-l);padding:16px 20px;background:var(--surface)}
.qitem .qq{font-size:15px;margin-bottom:12px}
.opts{display:grid;gap:7px}
.opt{appearance:none;text-align:left;font-family:var(--sans);font-size:14px;cursor:pointer;
  padding:9px 14px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface-2);
  color:var(--ink);transition:.14s}
.opt:hover{border-color:var(--brand)}
.opt.ok{background:var(--easy-tint);border-color:var(--easy);color:var(--easy)}
.opt.no{background:var(--hard-tint);border-color:var(--hard);color:var(--hard)}
.opt:disabled{cursor:default}
.qfb{margin-top:11px;font-size:13.5px;color:var(--muted);display:none}
.qfb.on{display:block}
.pager{display:flex;justify-content:space-between;gap:14px;margin:60px 0 0;
  padding-top:26px;border-top:1px solid var(--rule)}
.pager a{flex:1;text-decoration:none;color:inherit;padding:16px 20px;border:1px solid var(--rule);
  border-radius:var(--r-l);background:var(--surface);transition:.16s}
.pager a:hover{border-color:var(--brand)}
.pager .pl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:5px}
.pager .pt{font-family:var(--serif);font-weight:600;font-size:.98rem}
.pager .nx{text-align:right}

/* compact inline fractions inside narrow chrome (sidebar, rows, chips) */
.sbox .frac,.lrow .frac,.chip .frac,.gmeta .frac,.qq .frac{display:inline;vertical-align:baseline;margin:0}
.sbox .frac>span,.lrow .frac>span,.chip .frac>span,.gmeta .frac>span{border-bottom:0!important;padding:0}
.sbox .frac>span:first-child::after,.lrow .frac>span:first-child::after,
.chip .frac>span:first-child::after,.gmeta .frac>span:first-child::after{content:"\2044"}

  };
  F.isosTrapezium = function () {
    var A = [36, 146], D = [224, 146], B = [82, 50], C = [178, 50], c = cent([A, B, C, D]);
    return svg('0 0 258 180', poly([A, B, C, D]) +
      ticks(A, B, 1) + ticks(D, C, 1) +
      line(A, C, 'fill="none" stroke="var(--brand)" stroke-width="1.5"') +
      line(B, D, 'fill="none" stroke="var(--brand)" stroke-width="1.5"') +

      vlabel(A, c, 'A') + vlabel(B, c, 'B') + vlabel(C, c, 'C') + vlabel(D, c, 'D') +

  };

      return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="34" rx="5" ' +
        'fill="' + (cl || 'var(--surface-2)') + '" stroke="currentColor" stroke-width="1.5"/>' +

      svg.appendChild(S('line', { x1: cx, y1: 8, x2: cx, y2: 292, stroke: 'var(--faint)', 'stroke-width': 1.6 }));

    about:  `<section class="section">
  <div class="wrap narrow prose">
    <span class="eyebrow">About the course</span>
    <h1 style="margin:14px 0 20px">How a lesson is built</h1>
    <p class="lede">Every topic page on this site is written to be taught, not read. It follows the
    forty-minute lesson exactly as it runs in class, and everything a teacher needs is on the one page.</p>

    <h3>The forty minutes</h3>
    <p>A lesson hour in Uzbekistan is forty minutes. That is not enough time to improvise, so the page
    puts the clock on the screen: five minutes to warm up, twelve to explain, eight on the interactive
    model, thirteen on practice, two to set the homework. The clock is a guide, not a rule — but a page
    that ignores it is a page you cannot teach from.</p>

    <h3>The explanation</h3>
    <p>Definitions, rules and properties, written plainly, in English. Every geometric fact arrives with
    a drawn figure — a parallelogram with its ticks and angle arcs, a trapezium with its midline marked,
    Thales' theorem with the equal cuts shown. Nothing is described that can be drawn.</p>

    <h3>The interactive model</h3>
    <p>One model per topic, built to be shown on the board. Drag a vertex of the parallelogram and watch
    the opposite sides stay equal. Move the slider and watch the angle sum of a polygon follow
    180°(n − 2). Change k and watch the hyperbola turn over. A learner should drive it, not the teacher.</p>

    <h3>Twenty-one problems</h3>
    <p>Seven easy, seven medium, seven hard, with answers you can reveal one set at a time. The easy row
    is for everybody, the medium row is the standard question the control work will ask, and the hard row
    is for the learners who finish early. The split is deliberate: a class of thirty needs three
    difficulties on the same board.</p>

    <h3>Homework that gets done</h3>
    <p>Four to six problems and a textbook reference. Short enough that a learner attempts all of it,
    hard enough that attempting it teaches something.</p>

    <h3>Two curricula on one page</h3>
    <p>Each topic carries its page in the national textbook and its Cambridge Stage 9 unit. The special
    class and the Cambridge class are taught from the same resource, so a topic prepared once serves both.</p>

    <hr class="rule">
    <h3>Textbooks referenced</h3>
    <ul>
      <li><em>Algebra 8</em> — Sh. A. Alimov, A. R. Xalmuxamedov, M. A. Mirzaxmedov. O‘qituvchi, Tashkent 2019, 4th edition.</li>
      <li><em>Geometry 8</em> — A. A. Rahimkariev, M. A. Toxtaxodjaeva. Yangiyo‘l Poligraf Servis, 2019, 4th edition.</li>
      <li><em>Cambridge Lower Secondary Mathematics 9</em> — Learner’s Book and Workbook.</li>
    </ul>
    <p class="small">Page references point to these editions. Problems on this site are written for the
    course and are not reproduced from the textbooks.</p>
  </div>
</section>`,
    lesson: `<div class="lhead" id="lhead"></div><div class="lbody"><main class="lmain" id="lmain"></main><aside class="lside" id="lside"></aside></div>`
  };
  var NAV = [['#/', 'Home'], ['#/grades', 'Grades 5–11'], ['#/grade/8', 'Grade 8'], ['#/about', 'About the course']];

  function brandmark(sub) {
    return '<a class="brandmark" href="#/">' + LOGO + '<span><span class="bn">Anvarbek Khaydarov</span>' +
      '<span class="bs">' + (sub || 'Mathematics') + '</span></span></a>';
  }
  function chrome() {
    document.getElementById('chrome-head').innerHTML =
      '<header class="site-head"><div class="bar">' + brandmark() + '<nav class="nav" id="navlinks">' +
      NAV.map(function (n) { return '<a href="' + n[0] + '" data-h="' + n[0] + '">' + n[1] + '</a>'; }).join('') +
      '<button class="themebtn" id="themebtn" type="button" aria-label="Switch colour theme">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>' +
      '</nav></div></header>';
    document.getElementById('chrome-foot').innerHTML =
      '<footer class="site-foot"><div class="inner"><div>' + brandmark('Grades 5–11 · Uzbekistan &amp; Cambridge') + '</div>' +
      '<p class="fnote">Lesson resources for the Uzbekistan national programme and Cambridge Lower Secondary ' +
      'Mathematics. Built around 40-minute lessons: explanation, guided practice, 21 graded problems and short homework.</p>' +
      '<p class="fnote">Textbooks referenced — <em>Algebra 8</em>, Alimov · Xalmuxamedov · Mirzaxmedov (O‘qituvchi, 2019) · ' +
      '<em>Geometry 8</em>, Rahimkariev · Toxtaxodjaeva (2019) · <em>Cambridge Lower Secondary Mathematics 9</em>, ' +
      'Learner’s Book &amp; Workbook.</p></div></footer>';
    var b = document.getElementById('themebtn');
    var KEY = 'akm-theme', saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) { }
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
    b.addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) cur = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem(KEY, next); } catch (e) { }
    });
  }

  /* rewrite the multi-page links the shared renderers emit into hash routes */
  function fixLinks(scope) {
    [].forEach.call(scope.querySelectorAll('a[href]'), function (a) {
      var h = a.getAttribute('href');
      if (/^lesson\.html\?t=/.test(h)) a.setAttribute('href', '#/lesson/' + h.split('t=')[1]);
      else if (/^grade\.html\?g=/.test(h)) a.setAttribute('href', '#/grade/' + h.split('g=')[1]);
      else if (h === 'index.html') a.setAttribute('href', '#/');
      else if (h === 'grades.html') a.setAttribute('href', '#/grades');
      else if (h === 'about.html') a.setAttribute('href', '#/about');
    });
  }

  var ALL = [].concat(window.G8_ALG_Q1 || [], window.G8_GEO_Q1 || []);
  var INDEX = ALL.map(function (t) { return { id: t.id, title: t.title }; });
  var view = document.getElementById('view');

  function tile(g) {
    var live = g.status === 'live';
    return '<a class="gtile ' + (live ? 'live' : 'soon') + '" href="' + (live ? '#/grade/' + g.g : '#/grades') + '">' +
      '<span class="gtag chip ' + (live ? 'solid' : '') + '">' + (live ? 'Open' : 'Soon') + '</span>' +
      '<div class="gnum">' + g.g + '</div><div class="gname">' + g.name + '</div>' +
      '<div class="gmeta">' + g.meta + '</div></a>';
  }
  function rows(list) {
    return list.map(function (t) {
      return '<a class="lrow" href="#/lesson/' + t.id + '"><span class="ln">' + t.lessons + '</span>' +
        '<span><span class="lt">' + t.title + '</span><span class="lm">' + t.hours + ' × 40 min · ' +
        (t.uz || '') + (t.cam ? ' · ' + t.cam : '') + '</span></span>' +
        '<svg class="lgo" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>';
    }).join('');
  }

  function render() {
    var h = (location.hash || '#/').replace(/^#/, '');
    var parts = h.split('/').filter(Boolean);
    var page = parts[0] || 'home';
    var q = function (s) { return view.querySelector(s); };

    if (page === 'lesson') {
      var T = ALL.filter(function (x) { return x.id === parts[1]; })[0];
      view.innerHTML = VIEWS.lesson;
      if (!T) { q('#lmain').innerHTML = '<div style="padding:60px 0"><h2>Lesson not found</h2></div>'; }
      else window.renderTopic(T, INDEX);
    } else if (page === 'grade') {
      view.innerHTML = VIEWS.grade;
      q('#alglist').innerHTML = rows(window.G8_ALG_Q1 || []);
      q('#geolist').innerHTML = rows(window.G8_GEO_Q1 || []);
      q('#gsub').textContent = 'Quarter I is complete: ' + ALL.length +
        ' topic pages covering 45 lessons, each with an explanation, figures, an interactive model, ' +
        '21 graded problems and homework.';
    } else if (page === 'grades') {
      view.innerHTML = VIEWS.grades;
      q('#gradegrid').innerHTML = GRADES.map(tile).join('');
      q('#roadmap').innerHTML = GRADES.map(function (g) {
        var live = g.status === 'live';
        return '<tr><td><b>Grade ' + g.g + '</b></td><td>' + g.name + '</td><td><span class="chip ' +
          (live ? 'c-easy' : '') + '">' + (live ? 'Quarter I live' : 'In preparation') + '</span></td><td>' +
          g.meta + '</td></tr>';
      }).join('');
    } else if (page === 'about') {
      view.innerHTML = VIEWS.about;
    } else {
      view.innerHTML = VIEWS.home;
      q('#heromark').innerHTML = LOGO;
      var CLOCK = [[5, 'Warm-up', 'var(--faint)'], [12, 'Explanation', 'var(--brand)'],
                   [8, 'Interactive', 'var(--brass)'], [13, 'Practice', 'var(--easy)'], [2, 'HW', 'var(--hard)']];
      q('#clock').innerHTML = CLOCK.map(function (c) {
        return '<div style="flex:' + c[0] + ';background:' + c[2] + '">' + c[1] + ' · ' + c[0] + "'</div>";
      }).join('');
      q('#gradegrid').innerHTML = GRADES.map(tile).join('');
    }
    fixLinks(view);
    var cur = '#/' + (page === 'home' ? '' : parts.join('/'));
    [].forEach.call(document.querySelectorAll('#navlinks a'), function (a) {
      a.classList.toggle('on', a.getAttribute('data-h') === cur ||
        (page === 'lesson' && a.getAttribute('data-h') === '#/grade/8'));
    });
    window.scrollTo(0, 0);
  }

  chrome();
  window.addEventListener('hashchange', render);
  render();
})();
</script>
