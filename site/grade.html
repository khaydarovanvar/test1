<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/pages.css">
<title>Mathematics · Anvarbek Khaydarov</title>
<meta name="description" content="Lesson resources by grade — the Uzbekistan national programme mapped to Cambridge, with an explanation, figures, an interactive model, three-language terminology, 21 graded problems and homework for every topic.">
</head>
<body>
<div class="preload" id="preload" role="status" aria-live="polite">
  <div class="pl-in">
    <svg class="pl-mark" viewBox="0 0 64 64" aria-hidden="true">
      <path class="pl-arc" d="M40.03 56.73 A26 26 0 1 1 54.96 44.21" fill="none"
            stroke="var(--brass)" stroke-width="2.6" stroke-linecap="round"/>
      <circle class="pl-nib" cx="54.96" cy="44.21" r="2.9" fill="var(--brass)"/>
      <path class="pl-a" d="M32 15 L20 47 M32 15 L44 47 M24.2 36 H39.8" fill="none"
            stroke="currentColor" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="pl-name">Anvarbek Khaydarov</p>
    <p class="pl-sub">Mathematics · Grades 5&#8211;11</p>
    <div class="pl-bar"><i></i></div>
  </div>
</div>
<div id="site-header"></div>
<div class="lhead">
  <div class="inner">
    <p class="crumb"><a href="index.html">Home</a> / <a href="grades.html">Grades</a> / <span id="gcrumb">Grade</span></p>
    <h1 id="gtitle">Mathematics</h1>
    <p class="lede" style="margin-top:12px" id="gsub"></p>
  </div>
</div>
<section class="section tight">
  <div class="wrap">
    <div class="streamgrid" id="streamgrid" style="margin-bottom:44px"></div>

    <div class="sechead"><span class="eyebrow">Choose a quarter</span><h2>The teaching year</h2>
      <p id="qlede"></p></div>
    <div class="qtabs" id="qtabs"></div>

    <div class="sechead" style="margin-top:12px"><span class="eyebrow" id="alg-eyebrow">Algebra</span>
      <h2 id="alg-head">Algebra</h2><p id="alg-sub"></p></div>
    <div class="llist" id="alglist"></div>

    <div id="geoblock">
      <div class="sechead" style="margin-top:56px"><span class="eyebrow" id="geo-eyebrow">Geometry</span>
        <h2 id="geo-head">Geometry</h2><p id="geo-sub"></p></div>
      <div class="llist" id="geolist"></div>
    </div>
  </div>
</section>
<div id="site-footer"></div>
<script src="assets/app.js" data-root="./"></script>
<script src="assets/mathfmt.js"></script>
<script src="assets/figures.js"></script>
<script src="data/grades.js"></script>
<script src="data/g6-mat.js"></script>
<script src="data/g7-mat.js"></script>
<script src="data/g8-alg.js"></script>
<script src="data/g8-geo.js"></script>
<script src="data/g9-alg.js"></script>
<script src="data/g9-geo.js"></script>
<script src="data/g10-alg.js"></script>
<script src="data/g10-geo.js"></script>
<script src="data/g11-alg.js"></script>
<script src="data/g11-geo.js"></script>
<script>
AKM.mount('grade.html');

var G = +(AKM.qs('g') || 8);
var INFO = (window.GRADE_INFO || {})[G];
if (!INFO) { window.location.replace('grades.html'); }

var QUARTERS = INFO.quarters;
/* Grades 6 and 7 are taught as one subject, so their topics live in G<n>_MAT
   and the geometry column is hidden. */
var SINGLE = !!INFO.single;
var ALL_ALG = (window['G' + G + (SINGLE ? '_MAT' : '_ALG')] || []);
var ALL_GEO = SINGLE ? [] : (window['G' + G + '_GEO'] || []);
if (SINGLE) document.getElementById('geoblock').hidden = true;

document.title = 'Grade ' + G + ' Mathematics · Anvarbek Khaydarov';
document.getElementById('gcrumb').textContent = 'Grade ' + G;
document.getElementById('gtitle').textContent = INFO.title;
document.getElementById('qlede').innerHTML = INFO.lede;
document.getElementById('streamgrid').innerHTML = INFO.streams.map(function (s) {
  return '<div class="scard" style="--sc:var(--' + s[0] + ')"><div class="lbl">' + s[1] + '</div>' +
    '<h3>' + s[2] + '</h3><p>' + s[3] + '</p><div class="figs">' + s[4] + '</div></div>';
}).join('');

function has(q) {
  return ALL_ALG.some(function (t) { return t.quarter === q; }) ||
         ALL_GEO.some(function (t) { return t.quarter === q; });
}
function rows(list){
  if (!list.length) return '<p class="small" style="padding:8px 2px">Being written — the annual plan for this quarter is already published.</p>';
  return list.map(function(t){
    return '<a class="lrow" href="lesson.html?t='+t.id+'">'+
      '<span class="ln">'+t.lessons+'</span>'+
      '<span><span class="lt">'+t.title+'</span>'+
      '<span class="lm">'+t.hours+' × 40 min · '+(t.uz||'')+(t.cam?' · '+t.cam:'')+'</span></span>'+
      '<svg class="lgo" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'+
      '</a>';
  }).join('');
}
function hours(list){ return list.reduce(function(s,t){return s+t.hours;},0); }
function show(q){
  var Q = QUARTERS[q-1];
  var a = ALL_ALG.filter(function(t){return t.quarter===q;});
  var g = ALL_GEO.filter(function(t){return t.quarter===q;});
  document.getElementById('alg-eyebrow').textContent = Q.label;
  document.getElementById('alg-head').textContent =
    (SINGLE ? 'Mathematics — ' : 'Algebra — ') + hours(a) + ' hours';
  document.getElementById('alg-sub').innerHTML = SINGLE ? (Q.mat || Q.alg) : Q.alg;
  if (!SINGLE) {
    document.getElementById('geo-eyebrow').textContent = Q.label;
    document.getElementById('geo-head').textContent = 'Geometry — ' + hours(g) + ' hours';
    document.getElementById('geo-sub').innerHTML = Q.geo;
    document.getElementById('geolist').innerHTML = rows(g);
  }
  document.getElementById('alglist').innerHTML = rows(a);
  [].forEach.call(document.querySelectorAll('.qtab'), function(b){
    b.setAttribute('aria-pressed', +b.dataset.q === q ? 'true' : 'false');
  });
  try { sessionStorage.setItem('akm-q-' + G, q); } catch(e){}
}
document.getElementById('qtabs').innerHTML = QUARTERS.map(function(Q){
  var live = has(Q.q);
  return '<button class="qtab" data-q="'+Q.q+'" aria-pressed="false"'+(live?'':' disabled')+'>'+
    Q.label+' · '+(live?'live':'soon')+'</button>';
}).join('');
[].forEach.call(document.querySelectorAll('.qtab'), function(b){
  b.addEventListener('click', function(){ show(+b.dataset.q); });
});
var start = 0;
for (var qi = 1; qi <= 4; qi++) { if (has(qi)) { start = qi; break; } }
try { var sv = +sessionStorage.getItem('akm-q-' + G); if (sv && has(sv)) start = sv; } catch(e){}
show(start || 1);
document.getElementById('gsub').textContent =
  (ALL_ALG.length + ALL_GEO.length) + ' topic pages written so far, each with an explanation, ' +
  'figures, an interactive model, three-language terminology, 21 graded problems and homework.';
</script>
</body>
</html>
