<body>
<div id="site-header"></div>

<div class="lbody">
  <main class="lmain" id="lmain"></main>
  <aside class="lside" id="lside"></aside>
</div>
<div id="site-footer"></div>

<script src="data/g8-alg.js"></script>
<script src="data/g8-geo.js"></script>
<script>
AKM.mount('');
(function(){
  var all = [].concat(window.G8_ALG || [], window.G8_GEO || []);
  var id = AKM.qs('t') || (all[0] && all[0].id);
  var T = all.filter(function(x){return x.id===id;})[0];
  /* the topic switcher lists the same stream and quarter, in teaching order */
  var index = (T ? all.filter(function(x){ return x.stream===T.stream && x.quarter===T.quarter; }) : all)
    .map(function(x){return {id:x.id,title:x.title,group:'L '+x.lessons};});
  if (!T) {
    document.getElementById('lmain').innerHTML =
      '<div style="padding:60px 0"><h2>Lesson not found</h2>' +
      '<p class="small">Pick a topic from the <a href="grade.html?g=8">Grade 8 page</a>.</p></div>';
    return;
  }
  renderTopic(T, index);
})();
</script>
</body>
</html>
