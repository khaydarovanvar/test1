<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', 'Arial', sans-serif">
  <!-- Q17: a hungry machine on a factory line swallows numbers and drops a mystery box -->
  <rect width="800" height="500" fill="#fdf6e3"/>

  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd93d" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffd93d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- factory ceiling lamps -->
  <g>
    <line x1="130" y1="0" x2="130" y2="58" stroke="#b9ac8c" stroke-width="4"/>
    <path d="M100 58 h60 l-12 26 h-36z" fill="#8d99ae" stroke="#6c7689" stroke-width="3"/>
    <circle cx="130" cy="90" r="9" fill="#ffd93d"/>
    <path d="M112 88 L94 270 L166 270 L148 88z" fill="url(#beam)"/>

    <line x1="285" y1="0" x2="285" y2="40" stroke="#b9ac8c" stroke-width="4"/>
    <path d="M258 40 h54 l-11 24 h-32z" fill="#8d99ae" stroke="#6c7689" stroke-width="3"/>
    <circle cx="285" cy="70" r="8" fill="#ffd93d"/>
    <path d="M269 68 L253 262 L317 262 L301 68z" fill="url(#beam)"/>
  </g>

  <!-- floor -->
  <line x1="0" y1="432" x2="800" y2="432" stroke="#e8dcbe" stroke-width="4"/>
  <ellipse cx="585" cy="425" rx="118" ry="16" fill="#c9bb98" opacity="0.35"/>
  <ellipse cx="260" cy="425" rx="180" ry="11" fill="#c9bb98" opacity="0.22"/>

  <!-- conveyor belt -->
  <rect x="30" y="360" width="480" height="30" rx="15" fill="#8d99ae"/>
  <circle cx="60" cy="375" r="10" fill="#4a4e69"/>
  <circle cx="160" cy="375" r="10" fill="#4a4e69"/>
  <circle cx="260" cy="375" r="10" fill="#4a4e69"/>
  <circle cx="360" cy="375" r="10" fill="#4a4e69"/>
  <circle cx="460" cy="375" r="10" fill="#4a4e69"/>

  <!-- number tiles marching in -->
  <g text-anchor="middle" font-weight="bold">
    <rect x="40" y="300" width="60" height="55" rx="10" fill="#a8dadc" stroke="#457b9d" stroke-width="3"/>
    <text x="70" y="338" font-size="26" fill="#1d3557">1</text>
    <rect x="120" y="295" width="60" height="60" rx="10" fill="#a8dadc" stroke="#457b9d" stroke-width="3" transform="rotate(-4 150 325)"/>
    <text x="150" y="335" font-size="26" fill="#1d3557" transform="rotate(-4 150 325)">4</text>
    <rect x="205" y="298" width="65" height="58" rx="10" fill="#a8dadc" stroke="#457b9d" stroke-width="3" transform="rotate(3 237 327)"/>
    <text x="237" y="336" font-size="26" fill="#1d3557" transform="rotate(3 237 327)">13</text>
    <rect x="293" y="296" width="65" height="60" rx="10" fill="#a8dadc" stroke="#457b9d" stroke-width="3" transform="rotate(-3 325 326)"/>
    <text x="325" y="336" font-size="26" fill="#1d3557" transform="rotate(-3 325 326)">40</text>
    <rect x="380" y="294" width="75" height="62" rx="10" fill="#a8dadc" stroke="#457b9d" stroke-width="3" transform="rotate(4 417 325)"/>
    <text x="417" y="336" font-size="26" fill="#1d3557" transform="rotate(4 417 325)">121</text>
  </g>
  <!-- little legs on the last tile, running -->
  <line x1="400" y1="356" x2="390" y2="374" stroke="#1d3557" stroke-width="4" stroke-linecap="round"/>
  <line x1="435" y1="356" x2="445" y2="374" stroke="#1d3557" stroke-width="4" stroke-linecap="round"/>

  <!-- output chute -->
  <rect x="675" y="330" width="60" height="18" rx="9" fill="#8d99ae"/>

  <!-- the number machine monster -->
  <g>
    <rect x="490" y="170" width="190" height="220" rx="28" fill="#e63946" stroke="#9d2230" stroke-width="4"/>
    <!-- antenna -->
    <line x1="585" y1="170" x2="585" y2="132" stroke="#9d2230" stroke-width="6"/>
    <circle cx="585" cy="124" r="12" fill="#ffd93d" stroke="#9d2230" stroke-width="3"/>
    <!-- eyes -->
    <circle cx="548" cy="215" r="24" fill="#fff" stroke="#9d2230" stroke-width="2"/>
    <circle cx="624" cy="215" r="24" fill="#fff" stroke="#9d2230" stroke-width="2"/>
    <circle cx="556" cy="220" r="10" fill="#1d3557"/>
    <circle cx="632" cy="220" r="10" fill="#1d3557"/>
    <!-- hungry open mouth -->
    <ellipse cx="585" cy="272" rx="52" ry="30" fill="#1d3557"/>
    <ellipse cx="585" cy="288" rx="26" ry="12" fill="#ff8fa3"/>
    <path d="M551 250 l8 14 l10 -14 l9 14 l10 -14 l9 14 l9 -14" fill="#fff"/>
    <!-- belly label -->
    <rect x="518" y="315" width="134" height="52" rx="12" fill="#fff" stroke="#9d2230" stroke-width="3"/>
    <text x="585" y="353" font-size="34" font-weight="bold" text-anchor="middle" fill="#e63946" letter-spacing="6">? ? ?</text>
    <!-- arms -->
    <path d="M490 250 q-35 20 -30 55" fill="none" stroke="#9d2230" stroke-width="9" stroke-linecap="round"/>
    <path d="M680 250 q35 20 30 55" fill="none" stroke="#9d2230" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- mystery gift popping out of the chute -->
  <g>
    <rect x="712" y="268" width="60" height="56" rx="8" fill="#ffd93d" stroke="#f4b400" stroke-width="3"/>
    <line x1="742" y1="268" x2="742" y2="324" stroke="#f4b400" stroke-width="5"/>
    <text x="742" y="311" font-size="34" font-weight="bold" text-anchor="middle" fill="#9d2230">?</text>
    <path d="M730 268 q12 -18 22 -4 q10 -14 20 4" fill="none" stroke="#f4b400" stroke-width="4"/>
  </g>
  <text x="742" y="240" font-size="24" text-anchor="middle" fill="#f4b400" font-weight="bold">✨</text>

  <!-- speech bubble -->
  <g>
    <rect x="330" y="90" width="300" height="60" rx="18" fill="#fff" stroke="#457b9d" stroke-width="3"/>
    <path d="M520 150 l-6 26 l32 -26z" fill="#fff" stroke="#457b9d" stroke-width="3"/>
    <text x="480" y="128" font-size="24" text-anchor="middle" fill="#1d3557" font-weight="bold">Ням-ням! Yum-yum!</text>
  </g>
</svg>
