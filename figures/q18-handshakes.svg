<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', 'Arial', sans-serif">
  <!-- Q18: six people in a greeting scrum — arms vanish into a dust cloud -->
  <rect width="800" height="500" fill="#eef7ff"/>

  <!-- arms reaching into the middle (deliberately tangled and covered) -->
  <g stroke="#f4a261" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M285 155 Q345 195 395 230"/>
    <path d="M300 190 Q350 235 415 250"/>
    <path d="M515 155 Q455 195 405 235"/>
    <path d="M500 190 Q450 240 385 255"/>
    <path d="M215 285 Q290 260 370 245"/>
    <path d="M225 320 Q300 300 380 275"/>
    <path d="M585 285 Q510 260 430 245"/>
    <path d="M575 320 Q500 300 420 275"/>
    <path d="M335 385 Q370 320 395 275"/>
    <path d="M365 400 Q395 340 415 285"/>
    <path d="M465 385 Q430 320 405 275"/>
    <path d="M435 400 Q405 340 385 285"/>
  </g>

  <!-- dust cloud of the scrum: the tangle is hidden, nothing to count -->
  <g fill="#cfe4ff" opacity="0.95">
    <circle cx="400" cy="255" r="62"/>
    <circle cx="342" cy="230" r="44"/>
    <circle cx="458" cy="230" r="44"/>
    <circle cx="350" cy="292" r="42"/>
    <circle cx="450" cy="292" r="42"/>
    <circle cx="400" cy="192" r="40"/>
    <circle cx="400" cy="318" r="38"/>
    <circle cx="312" cy="262" r="34"/>
    <circle cx="488" cy="262" r="34"/>
  </g>

  <!-- hands and motion marks popping out of the cloud -->
  <g>
    <circle cx="332" cy="200" r="15" fill="#ffcf99" stroke="#e07b39" stroke-width="3"/>
    <circle cx="470" cy="205" r="14" fill="#ffcf99" stroke="#e07b39" stroke-width="3"/>
    <circle cx="358" cy="318" r="13" fill="#ffcf99" stroke="#e07b39" stroke-width="3"/>
    <circle cx="447" cy="315" r="12" fill="#ffcf99" stroke="#e07b39" stroke-width="3"/>
  </g>
  <g stroke="#8fbfe8" stroke-width="4" stroke-linecap="round">
    <path d="M300 170 l-16 -16"/>
    <path d="M500 170 l16 -16"/>
    <path d="M296 340 l-18 14"/>
    <path d="M504 340 l18 14"/>
    <path d="M400 138 l0 -20"/>
  </g>
  <text x="330" y="150" font-size="26" fill="#e07b39" font-weight="bold">✶</text>
  <text x="462" y="352" font-size="24" fill="#e07b39" font-weight="bold">✶</text>

  <!-- the six greeters -->
  <g>
    <!-- upper-left: dizzy -->
    <circle cx="250" cy="120" r="44" fill="#2a9d8f" stroke="#1d6f65" stroke-width="3"/>
    <path d="M232 110 l12 12 m0 -12 l-12 12" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M258 110 l12 12 m0 -12 l-12 12" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="252" cy="142" rx="9" ry="6" fill="#0f4d45"/>

    <!-- upper-right: cheerful -->
    <circle cx="550" cy="120" r="44" fill="#8e7dbe" stroke="#5f5390" stroke-width="3"/>
    <circle cx="535" cy="112" r="5.5" fill="#fff"/><circle cx="565" cy="112" r="5.5" fill="#fff"/>
    <circle cx="536" cy="113" r="2.5" fill="#333"/><circle cx="564" cy="113" r="2.5" fill="#333"/>
    <path d="M534 136 q16 13 32 0" stroke="#3f3568" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- left: surprised -->
    <circle cx="170" cy="300" r="44" fill="#e76f51" stroke="#b3492f" stroke-width="3"/>
    <circle cx="155" cy="290" r="5.5" fill="#fff"/><circle cx="185" cy="290" r="5.5" fill="#fff"/>
    <circle cx="156" cy="291" r="2.5" fill="#333"/><circle cx="184" cy="291" r="2.5" fill="#333"/>
    <ellipse cx="170" cy="320" rx="9" ry="11" fill="#7a2e1a"/>

    <!-- right: sweating -->
    <circle cx="630" cy="300" r="44" fill="#4cc9f0" stroke="#2a94ba" stroke-width="3"/>
    <circle cx="615" cy="290" r="5.5" fill="#fff"/><circle cx="645" cy="290" r="5.5" fill="#fff"/>
    <circle cx="616" cy="291" r="2.5" fill="#333"/><circle cx="644" cy="291" r="2.5" fill="#333"/>
    <ellipse cx="630" cy="318" rx="10" ry="7" fill="#14536b"/>
    <path d="M668 274 q9 13 0 20 q-9 -7 0 -20z" fill="#a5e7ff" stroke="#2a94ba" stroke-width="2"/>

    <!-- bottom-left: grinning -->
    <circle cx="310" cy="410" r="44" fill="#e9c46a" stroke="#bb9540" stroke-width="3"/>
    <circle cx="295" cy="400" r="5.5" fill="#fff"/><circle cx="325" cy="400" r="5.5" fill="#fff"/>
    <circle cx="296" cy="401" r="2.5" fill="#333"/><circle cx="324" cy="401" r="2.5" fill="#333"/>
    <path d="M292 422 q18 20 36 0z" fill="#7d6222"/>

    <!-- bottom-right: content -->
    <circle cx="490" cy="410" r="44" fill="#f28ab2" stroke="#c25a85" stroke-width="3"/>
    <circle cx="475" cy="400" r="5.5" fill="#fff"/><circle cx="505" cy="400" r="5.5" fill="#fff"/>
    <circle cx="476" cy="401" r="2.5" fill="#333"/><circle cx="504" cy="401" r="2.5" fill="#333"/>
    <path d="M474 424 q16 13 32 0" stroke="#8f3b60" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- greetings flying around -->
  <g>
    <rect x="600" y="48" width="180" height="52" rx="16" fill="#fff" stroke="#5f5390" stroke-width="3"/>
    <path d="M628 100 l-6 22 l26 -20z" fill="#fff" stroke="#5f5390" stroke-width="3"/>
    <text x="690" y="81" font-size="21" text-anchor="middle" fill="#5f5390" font-weight="bold">Приятно! Salom!</text>
  </g>
  <g>
    <rect x="24" y="150" width="176" height="52" rx="16" fill="#fff" stroke="#1d6f65" stroke-width="3"/>
    <path d="M176 202 l16 20 l0 -22z" fill="#fff" stroke="#1d6f65" stroke-width="3"/>
    <text x="112" y="183" font-size="21" text-anchor="middle" fill="#1d6f65" font-weight="bold">Опять?! Yana?!</text>
  </g>
  <g>
    <rect x="562" y="392" width="212" height="52" rx="16" fill="#fff" stroke="#c25a85" stroke-width="3"/>
    <path d="M596 392 l-14 -22 l32 22z" fill="#fff" stroke="#c25a85" stroke-width="3"/>
    <text x="668" y="425" font-size="21" text-anchor="middle" fill="#c25a85" font-weight="bold">Ещё раз! Yana bir!</text>
  </g>
</svg>
