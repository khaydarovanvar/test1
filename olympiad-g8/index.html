<script>
(function () {
  var lang = window.MLLESSON.lang();
  window.MLLESSON.mountSwitch(lang);
  document.documentElement.lang = lang;

  var T = {
    ru: { home:'Главная', topics:'Темы',
          eyebrow:'8 класс',
          title:'Девятнадцать тем под AMC 8 и «Кенгуру»',
          lede:'Каждая тема — это полная теория с доказательствами, ' +
               'разобранные примеры и задачи с решениями: от разминки до ' +
               'уровня последних задач AMC 8. Русский и английский, одна ' +
               'кнопка.',
          soon:'Скоро', open:'Открыть тему', res:'Ресурсы',
          probs:['задача','задачи','задач'], secs:['раздел','раздела','разделов'] },
    en: { home:'Home', topics:'Topics',
          eyebrow:'Grade 8',
          title:'Nineteen topics for AMC 8 and Kangaroo',
          lede:'Every topic is the full theory with proofs, worked examples ' +
               'and problems with solutions — from a warm-up to the level of ' +
               'the last questions on AMC 8. Russian and English, one ' +
               'button.',
          soon:'Soon', open:'Open the topic', res:'Resources',
          probs:['problem','problems'], secs:['section','sections'] }
  }[lang];

  function plural(n, forms) {
    if (lang !== 'ru') return n + ' ' + forms[n === 1 ? 0 : 1];
    var a = n % 10, b = n % 100;
    var f = (a === 1 && b !== 11) ? 0 : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? 1 : 2;
    return n + ' ' + forms[f];
  }
  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }

  document.title = T.topics + ' — MathLab · ' + T.eyebrow;
  document.getElementById('eyebrow').textContent = T.eyebrow;
  document.getElementById('lxTitle').textContent = T.title;
  document.getElementById('lxLede').textContent = T.lede;
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
    el.textContent = T[el.getAttribute('data-t')] || el.textContent;
  });

  var have = {};
  (window.LESSON_INDEX || []).forEach(function (e) { have[e.n] = e; });

  function pick(v) {
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      return v[lang] != null ? v[lang] : v.en;
    }
    return v;
  }

  document.getElementById('lxMarquee').innerHTML = TOPICS.map(function (t) {
    return esc(have[t.n] ? pick(have[t.n].title) : pick(t.title));
  }).join(' <em>✦</em> ') + ' <em>✦</em> ';

  document.getElementById('lxGrid').innerHTML = TOPICS.map(function (t, i) {
    var L = have[t.n];
    var title = pick(L ? L.title : t.title);
    var href = L ? ('lesson.html?t=' + t.n + '&lang=' + lang) : 'index.html';
    return '<a class="tcard lx-card' + (L ? '' : ' soon') + '" data-cat="' + t.catKey +
      '" data-reveal data-reveal-delay="' + (i % 4) + '" href="' + href + '">' +
      '<span class="tnum">' + (t.n < 10 ? '0' : '') + t.n + '</span>' +
      '<h3>' + esc(title) + '</h3>' +
      '<p>' + esc(pick(L && L.sub ? L.sub : t.tip)) + '</p>' +
      '<span class="tfoot">' +
        (L ? '<span class="lx-stat"><span>' + esc(plural(L.sections, T.secs)) + '</span>' +
             '<span>' + esc(plural(L.problems, T.probs)) + '</span></span>'
           : '<span class="tcat">' + esc(T.soon) + '</span>') +
      '<span class="tgo">' + esc(L ? T.open : T.res) + ' →</span></span></a>';
  }).join('');
})();
</script>
<script>ML.apply(STRINGS, ML.lang());</script>
